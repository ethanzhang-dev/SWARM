<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SWARM · 屏幕端</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { background: #000; overflow: hidden; width: 100%; height: 100%; }
    canvas { display: block; }

    /* 启动覆盖层：表演开始前的全屏按钮 */
    #start-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: #000;
      display: flex; align-items: center; justify-content: center;
    }
    #start-btn {
      font-family: monospace; font-size: 18px; font-weight: bold;
      letter-spacing: 4px; color: #fff;
      background: transparent; border: 1px solid #444;
      padding: 20px 48px; cursor: pointer;
      transition: border-color 0.2s;
    }
    #start-btn:hover { border-color: #fff; }
  </style>
</head>
<body>

  <!-- 启动覆盖层：点击后初始化音频 + 连接服务器，然后消失 -->
  <div id="start-overlay">
    <button id="start-btn">BEGIN</button>
  </div>

  <!--
    ★ 脚本引入顺序（不能乱）：
    ① Tone.js       —— sound.js 依赖它，必须最先
    ② p5.js         —— 绘图框架
    ③ sound.js      —— 你的四音色模块（暴露 SwarmSound 对象）
    ④ swarm-net.js  —— 整合层（网络+闪亮+消退+OFFLINE）
    ⑤ 画面代码（下面的 <script> 块）
  -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <!-- <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script> -->
  <script src="sound.js"></script>
  <script src="swarm-net.js"></script>

  <script>
    // ── 启动按钮：点击后初始化音频 + 连接服务器 ──────────────────────────
    document.getElementById('start-btn').addEventListener('click', async function () {
      this.textContent = 'INITIALIZING...';
      this.disabled = true;
      await swarmInit(); // 音频初始化 + 连接服务器（必须在用户手势里）
      document.getElementById('start-overlay').style.display = 'none';
    });

    // ========================================================================
    // p5.js 画面代码
    // ========================================================================

    function setup() {
      createCanvas(windowWidth, windowHeight);
      pixelDensity(1); // 关掉高分屏2倍渲染，帧率提升最明显的一行
      console.log('[屏幕] setup 完成，等待点击 BEGIN...');
    }

    function draw() {
      // ── 第一行：更新闪亮衰减 + 消退 ──
      swarmUpdate();

      background(0);

      // ═══════════════════════════════════════════════════════════════════
      // ★★★ 占位视觉 · 开始 ★★★
      // 整合跑通后，把下面这一行换成你的 FaceMesh 三层绘制代码。
      // 画线描时用 swarmLineAlpha(你的值)，画视频时用 swarmVideoAlpha(你的值)。
      // ═══════════════════════════════════════════════════════════════════

      drawPlaceholderVisual();

      // ═══════════════════════════════════════════════════════════════════
      // ★★★ 占位视觉 · 结束 ★★★
      // ═══════════════════════════════════════════════════════════════════

      drawDebugInfo();

      // ── 最后一行：OFFLINE 时盖黑屏 ──
      swarmDrawOverlay();
    }

    // ── 占位视觉：一个圆，演示闪亮和消退 ────────────────────────────────
    function drawPlaceholderVisual() {
      push();
      noFill();

      // 外圈（模拟线描）：swarmLineAlpha 控制亮度——触摸时亮、无人时暗
      stroke(255, swarmLineAlpha(180));
      strokeWeight(2);
      let r = min(width, height) * 0.35;
      ellipse(width / 2, height / 2, r, r);

      // 内圈（模拟视频层）：swarmVideoAlpha 只跟消退走、不参与闪亮
      stroke(100, 200, 255, swarmVideoAlpha(120));
      strokeWeight(1);
      ellipse(width / 2, height / 2, r * 0.6, r * 0.6);

      // 闪亮光晕（触摸瞬间出现，快速消失）
      if (SWARM.flashIntensity > 0.01) {
        stroke(255, SWARM.flashIntensity * 200);
        strokeWeight(SWARM.flashIntensity * 6);
        ellipse(width / 2, height / 2, r * (1 + SWARM.flashIntensity * 0.15), r * (1 + SWARM.flashIntensity * 0.15));
      }
      pop();
    }

    // ── 调试信息（跑通后可删）────────────────────────────────────────────
    function drawDebugInfo() {
      push();
      noStroke(); fill(80);
      textFont('monospace'); textSize(13); textAlign(LEFT, TOP);
      let s = SWARM.state;
      let lines = [
        'FPS: ' + nf(frameRate(), 0, 0),
        '连接: ' + (SWARM.connected ? 'YES' : 'NO'),
        '状态: ' + SWARM.status,
        '能量: ' + s.energy,
        '本轮触摸: ' + s.cycleTouches + ' / ' + s.threshold,
        '贡献计数: ' + s.contribution,
        'flash: ' + nf(SWARM.flashIntensity, 0, 2),
        'fade:  ' + nf(SWARM.fade, 0, 2),
      ];
      for (let i = 0; i < lines.length; i++) text(lines[i], 12, 12 + i * 18);
      pop();
    }

    function windowResized() { resizeCanvas(windowWidth, windowHeight); }
  </script>

</body>
</html>
