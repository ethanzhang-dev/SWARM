<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SWARM · 屏幕脸 v4 · 一笔画</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>

<!--
  ════════════════════════════════════════════════════════════════════
  这一轮新加：隐藏的 SVG 滤镜——真正的"局部对比度增强"(unsharp mask)

  为什么不用 CSS contrast()：
  contrast() 是整体线性拉伸黑白差距，皮肤上本来就平坦的区域还是平坦，
  不会长出纹理。要让"暗部的暗、结构的边缘"变清楚，需要的是经典的
  "反锐化蒙版"算法：结果 = 原图 + 强度×(原图-模糊版原图)。
  这个算法能在真正没有细节的地方保持平坦，只放大原本存在的
  边缘和纹理——这才是医学影像"每个像素都在承载数据"的来源。

  用 SVG 滤镜实现（而不是手写像素循环）：
  Canvas 2D 的 drawingContext.filter 可以直接引用 url(#滤镜id)，
  GPU加速、零JS像素操作开销。feComposite 的 arithmetic 模式
  可以做 k2×原图 + k3×模糊图 的线性组合，就是反锐化公式本身。

  k2 / k3 的值由"细节强化"滑块实时改写（在 drawVideoLayer 里）。
  ════════════════════════════════════════════════════════════════════
-->
<svg style="position:absolute;width:0;height:0" aria-hidden="true">
  <filter id="unsharpMask" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blurred"/>
    <feComposite id="unsharpComposite" in="SourceGraphic" in2="blurred"
                 operator="arithmetic" k1="0" k2="1" k3="0" k4="0"/>
  </filter>
</svg>

<!-- ★ SWARM 接线：socket.io 库，必须在其他脚本前面 -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/addons/p5.dom.min.js"></script>
<script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
<script>

// ══════════════════════════════════════════════════════════════════════
//  SWARM 屏幕脸 v6 —— 方向已定：A方向（越维持越抽干）
//
//  核心机制：一个 energy 值（0-100）驱动三阶段视觉衰竭。
//  energy 最终由 server.js 通过 socket.io 传入；现在还没接 socket，
//  所以本地模拟：按 T 键 = 模拟一次触摸（消耗能量+触发flash），
//  不摸时能量自动缓慢回升。
//
//  三阶段：
//   阶段1 energy 100→50   完美取悦：videoAlpha=80，网格安静，flash满强度
//   阶段2 energy 50→10    机能衰竭：videoAlpha滑向20，主线坐标漂移，
//                          网格抽搐断连，flash变成不稳定频闪
//   阶段3 energy=0         被动死机：冻结画面(2.5秒)→纯黑→SYSTEM OFFLINE
//
//  已锁定的基础参数（原子测试定的，不是滑块，是写死的常量）：
//   遮罩=跟随脸部轮廓  背景=纯黑  主线=冷白/纯白 线宽1.0 工业断裂虚线
//   网格待机=线宽0.5、alpha 30  视频待机=videoAlpha 80
//
//  ═══ 键盘（开发测试用）═══
//   T     模拟一次触摸（消耗能量 + flash）★ 测试用，正式版是socket事件
//   R     模拟 systemOnline（重置 energy=100，从OFFLINE状态恢复）
//   ← →   收缩量   ↑ ↓ 笔触抖动   D 细节层级
//   H 头发  E 耳朵  G 辉光  M 遮罩模式（调试用，正式已锁定跟随轮廓）
//   1/2/3 配色   S 存图
// ══════════════════════════════════════════════════════════════════════


// ══════════════════════════════════════════════════════════════════════
//  已锁定的基础参数 —— 原子测试定的，写死成常量，不再是滑块
// ══════════════════════════════════════════════════════════════════════

const LOCKED_LINE_W        = 1.0;   // 主轮廓线线宽（原子测试锁定）
const LOCKED_COMPLETENESS  = 0.55;  // 工业级断裂虚线——永远保持断裂，不会随任何东西变流畅
const LOCKED_MESH_WIDTH    = 0.5;   // 网格待机线宽（原子测试锁定）
const LOCKED_MESH_ALPHA    = 30;    // 网格待机alpha（原子测试锁定，0-255制，30≈12%不透明）
const LOCKED_VIDEO_ALPHA_S1 = 80;   // 阶段1（完美取悦）视频透明度
const LOCKED_VIDEO_ALPHA_S2_FLOOR = 20; // 阶段2（机能衰竭）视频透明度下限

// ★ 冻结画面专用透明度——之前直接借用了上面的20（8%不透明度），
// 在正常光线的房间里几乎看不见，这是"不确定有没有冻结画面"的真正原因。
// 冻结画面是一次性的关键叙事时刻（"疲惫的脸"），必须让人确实看清楚，
// 所以单独给它一个高得多的值。这个数字没有被原子测试锁定过，可以随便调。
const FREEZE_FRAME_ALPHA = 130;

// ── 可调参数（这些还没锁定，仍可调）──────────────────────────────
let CONTRACT  = 0.06;  // 向鼻子收缩的比例。你旧版是0.22 → 收缩越多越不像你
let WOBBLE    = 1.4;   // 笔触抖动
let LINE_W    = LOCKED_LINE_W;  // 从锁定常量初始化，不再由滑块/键盘[ ]随意改
let DETAIL    = 1;     // 0=最简 1=+鼻翼眼褶 2=+法令纹人中
let SHOW_HAIR = false; // 头发默认关（v3的头发是太阳图案，先关掉看脸本身）
let SHOW_EARS = true;
let SHOW_GLOW = true;  // 辉光总开关（键盘G切换）；辉光强度另外用滑块控制
let SHOW_TRAVEL = true; // 过渡线（一笔画的灵魂，键盘Y切换对比，T键现在用于模拟触摸）
let HAIR_LEN  = 90;
let PALETTE   = 0;
let TARGET_H  = 0.62;  // 脸高占屏幕高度的比例（自动放大的目标）——★现在由 VIEW.FH 替代，这行保留只供旧代码参考

// ══════════════════════════════════════════════════════════════════════
//  ★★★ VIEW —— 屏幕构图常量 ★★★
//
//  这是【概念参数，不是布局参数】。
//  任何窗口不得随手改这里的数字。
//
//  这里定义的是"脸在视觉上应该落在画面哪个区域"这个艺术决定：
//    顶部留黑 8%
//    脸的区域高 42%，竖直中心在画面 32% 处（脸偏上，底部大量留黑）
//    底部留黑 50%（从画面底部往上算起）
//
//  推导（供理解，不用手改）：
//    脸顶边 = CY - FH/2 = 0.32 - 0.21 = 0.11 (画面 11% 处)
//    脸底边 = CY + FH/2 = 0.32 + 0.21 = 0.53 (画面 53% 处)
//    底部黑区从 50% 处开始——脸底微微进入黑区，是有意的
//
//  改动影响：ptFrom() / autoZoom / drawOfflineScreen / applyFaceMask
//  全文件里只有这一处定义，不要在其他地方硬编码数字来绕过这里。
// ══════════════════════════════════════════════════════════════════════

const VIEW = {
  CX: 0.50,   // 脸水平中心 = 屏幕宽度的 50%（正中）
  CY: 0.32,   // 脸竖直中心 = 屏幕总高的 32%
  FH: 0.42,   // 脸区域高度 = 屏幕总高的 42%
  // 以上三项是原始定义，其余均为推导值——
  // get FW()  { return this.FH * 0.78; }   // 脸宽估算≈脸高×0.78（面部自然比例）
  // get TOP() { return this.CY - this.FH / 2; }  // 脸顶边 = 0.11
  // get BOT() { return this.CY + this.FH / 2; }  // 脸底边 = 0.53
};

// 运行时辅助：把 VIEW 的比例数字转成当前画布的屏幕像素值
// 调用示例：viewCY() → 脸的竖直中心在多少像素 Y 处
function viewCY(){ return height * VIEW.CY; }
function viewCX(){ return width  * VIEW.CX; }
function viewFH(){ return height * VIEW.FH; }
// 脸左缘估算（faceBoxScreen 有实测值时用实测，否则用比例估算）
function viewFaceLeft(){
  if(typeof faceBoxScreen !== 'undefined' && faceBoxScreen){
    return faceBoxScreen.x;                  // 实测左缘（最准确）
  }
  return viewCX() - viewFH() * 0.39;        // 估算：脸宽约为脸高×0.78，取一半
}

// ── 自定义颜色：锁定为"冷白/纯白"二选一，默认冷白 ──
// null = 用 PALETTES 渐变；非null = 纯色覆盖（现在只留冷白/纯白两个按钮）
let customColor = hexToRgbArr_safe('#E8F4F8');  // 默认冷白（原子测试锁定的方向）

function hexToRgbArr_safe(hex){
  // 提前声明用的小工具：因为 customColor 在文件顶部就要初始化，
  // 而 hexToRgbArr() 定义在文件更下面。JS的函数声明会整体提升(hoist)，
  // 所以这里直接调用真正的 hexToRgbArr 也没问题，这个safe版本只是保险。
  hex = hex.replace('#','');
  return [parseInt(hex.substring(0,2),16), parseInt(hex.substring(2,4),16), parseInt(hex.substring(4,6),16)];
}

const PALETTES = [
  { name:"AMBER / RED", stops:[[255,235,120],[255,140,30],[220,40,10]], glow:"rgba(255,80,10,0.75)" },
  { name:"VIOLET/CYAN", stops:[[170,60,255],[60,220,255],[0,255,230]],  glow:"rgba(80,180,255,0.7)" },
  { name:"WHITE",       stops:[[255,255,255],[235,235,240],[190,190,200]], glow:"rgba(255,255,255,0.45)" }
];


// ══════════════════════════════════════════════════════════════════════
//  视频层相关变量
// ══════════════════════════════════════════════════════════════════════

let videoLayer;          // 离屏画布：专门用来放"机器视野"处理后的摄像头画面

// videoAlphaSlider 已删除——videoAlpha 现在完全由 energy 状态机计算
// （阶段1固定80，阶段2从80滑向20），不再是可以随便拖的滑块。
// lineAlpha 也已删除——主线固定用 255（完全不透明），"变淡"不是这个方向的机制。
let grainSlider;         // 噪点颗粒强度（0-50，默认10）——这个还没锁定，继续可调
let brightSlider;        // 亮度（0-100 → map 到 0.0-1.0，默认78）
let contrastSlider;      // 对比度（0-100 → map 到 0.2-1.2，默认55）

// ══════════════════════════════════════════════════════════════════════
//  这一轮新加：机器视野（Machine Vision）相关变量
//
//  原来的视频层是全分辨率连续灰度，像一张调暗的自拍。
//  现在改成机器实际拿到的输入：低分辨率 + 硬像素块 + 4级灰阶。
// ══════════════════════════════════════════════════════════════════════

let lowRes = null;       // 低分辨率离屏画布，尺寸由 LOWRES 控制（默认192×192）
let lowResSlider = null; // 滑块：降采样尺寸（32-288，默认192）
let quantSlider  = null; // 滑块：量化级数（2-8，默认4）
const QUANT_FLOOR = 34;  // 黑场压制阈值：亮度低于这个值的像素直接压成纯黑
                          // 34 ≈ 原亮度的13%，能有效消除噪底，让暗部成为真正的黑

// 噪点图：128×96 的小图，每帧随机填充后拉伸到屏幕大小。
const GRAIN_W = 128, GRAIN_H = 96;
let noiseImg;


// ══════════════════════════════════════════════════════════════════════
//  这一轮新加①：背景遮罩相关
//
//  思路：不用 FaceMesh 轮廓做精确遮罩（那需要把468点连成一个多边形再
//  裁切，计算量大且边缘生硬）。改用一个以画布中心为圆心的椭圆渐变——
//  因为 pt() 已经把鼻子锁定在画布中心、autoZoom 已经把脸稳定在同一个
//  视觉大小，所以一个"固定在屏幕中央、大小跟着脸走"的椭圆渐变遮罩，
//  效果和"精确抠脸"几乎一样，但便宜得多，边缘也天然柔和。
// ══════════════════════════════════════════════════════════════════════

let maskSlider;    // 遮罩范围大小（30-250，默认100=基准大小）——三种模式共用同一个滑块

// ── 这一轮新加：遮罩模式切换（三种可对比）──
// 0 = 柔边椭圆（旧版，读起来像鬼影，问题反馈①）
// 1 = 跟随脸部轮廓（用FACE_OVAL landmark多边形，硬边/极窄羽化）
// 2 = 矩形硬边画框（脸部包围盒，完全无羽化）
let MASK_MODE = 1;   // 默认改成"跟随轮廓"，标本感更准确

let maskBtns = [];    // 遮罩模式按钮的DOM引用（用来在按M键切换时同步高亮）
function refreshMaskBtnStyles(){
  for(let b of maskBtns){
    styleColorButton(b.el, b.idx===MASK_MODE ? '#3a8' : '#222', b.idx===MASK_MODE ? '#fff' : '#999');
  }
}


// ══════════════════════════════════════════════════════════════════════
//  这一轮新加②：原始三角网格层（tessellation）
//
//  说明：MediaPipe 官方有一份固定的468点三角剖分表（约900个三角形，
//  2000多个索引），但那份表太长，我没办法保证凭记忆完整准确地写出来
//  ——错的三角形连接会比没有更糟。所以这里用一个我能验证正确性的
//  替代方案：邻近点自动连线（距离小于阈值的两点连一条边）。
//  视觉效果同样是"密集的三角网状结构"，而且我们在7/18版本的开发过程
//  中已经实测过这个方法在14168条边时仍有61.7fps，性能有保证。
//  如果你手上有官方三角剖分的索引数据，可以替换成那份，效果会更接近
//  "真实tessellation"，结构不用改。
// ══════════════════════════════════════════════════════════════════════

let meshLayer;                  // 离屏画布：三角网格单独画在这里，再整体遮罩+叠加
// meshSlider 和 meshLineWidthSlider 已删除——网格线宽/alpha 现在是锁定常量
// （LOCKED_MESH_WIDTH=0.5, LOCKED_MESH_ALPHA=30），阶段2会在这个基础上叠加
// "抽搐断连"效果（见 drawMeshLayer 里的 stage2Chaos 分支），但基础粗细/透明度不再可调。
let meshDensitySelect;            // 网格密度下拉框：100%/50%/33%/20%，对应MESH_SKIP（性能阀门，继续保留）
let meshEdges = null;             // 缓存的"哪两个点算相邻"（存索引对，不存坐标）
let lastMeshCompute = -999999;    // 上次重新计算邻接关系的时间戳
const MESH_DIST_PX = 30;          // 判定"相邻"的距离阈值（未缩放前的基准像素值）
const MESH_RECOMPUTE_MS = 3000;   // 每3秒重新计算一次邻接关系
let MESH_SKIP = 1;                // 性能阀门：1=画全部边，2=一半，3=三分之一，5=五分之一


// ══════════════════════════════════════════════════════════════════════
//  这一轮新加③：辉光强度 + 线条完整度
// ══════════════════════════════════════════════════════════════════════

let glowSlider;           // 辉光强度（0-100，默认25）——还没锁定，继续可调
// completenessSlider 已删除——线条完整度现在是锁定常量 LOCKED_COMPLETENESS=0.55
// lineWidthSlider / meshLineWidthSlider 已删除——都是锁定常量了
// flashMaxSlider 已删除——阶段1的flash现在固定100%强度（"冷白过曝"），不再可调


// ══════════════════════════════════════════════════════════════════════
//  ★★★ 核心：energy 状态机 ★★★
//
//  energy: 0-100，最终由 server.js 算出、通过 socket.io 传进来。
//  现在 socket 还没接，所以本地模拟：
//    - 按 T 键 = 模拟一次触摸 → onTouch() → flash + 消耗能量
//    - 不触摸一段时间后，能量自动缓慢回升（模拟"无人打扰、系统休息"）
//
//  三个阶段由 energy 数值本身决定，不需要额外的"状态"变量：
//    energy ∈ [50,100] → 阶段1 完美取悦
//    energy ∈ (0, 50)  → 阶段2 机能衰竭（越接近0越严重）
//    energy 只驱动画面的消退强弱，崩溃只由 systemOffline 事件触发
// ══════════════════════════════════════════════════════════════════════

let energy = 100;                  // 当前能量值，0-100
let cycleProgress = 0;             // 本轮触摸进度 0-1（=cycleTouches/threshold），server广播
                                    // 驱动"过度使用"路径的chaos预警，见getStageParams()
let lastEnergyActionTime = 0;      // 上次"触摸"或手动设置能量的时间戳（用来判断"多久没摸了"）
const ENERGY_REGEN_DELAY_MS = 600; // 停止触摸超过这么久，才开始被动回升
const ENERGY_REGEN_PER_SEC  = 8;   // 回升速度：每秒回升多少点（本地模拟用，server接入后这个值可能被替代）
const ENERGY_DRAIN_PER_TOUCH = 5;  // 模拟触摸时，一次消耗多少能量（同样是本地占位值）

let energySlider;   // 面板上的能量滑块——可以直接拖到任意值，跳着测试某个阶段的效果

// ── 系统状态：ONLINE 正常运行 / FREEZING 冻结画面倒数 / OFFLINE 黑屏死机 ──
let systemState = 'ONLINE';
let freezeStartTime = 0;
const FREEZE_DURATION_MS = 2500;   // 冻结画面停留多久（2-3秒区间，取2.5秒）
let frozenFrame = null;            // 离屏画布：能量归零那一刻的视频画面快照
let deathAlpha  = 0;               // frozenFrame 的当前透明度（0-1）
                                    // 进入FREEZING时从0.51开始，衰减到0.10后保持驻留
                                    // 直到 setSystemOnline() / sessionReset 才清零

// ── Flash 状态（阶段1：单次触摸的短暂过曝；阶段2：变成不稳定频闪）──
// flashIntensity: 0-1，每帧自动衰减(×0.92)。触摸时跳回1.0。
let flashIntensity = 0;


// ══════════════════════════════════════════════════════════════════════
//  这一轮新加④：局部对比度增强（"细节强化"）
//
//  和普通 contrast() 的区别：contrast()是整体线性拉伸，平坦的皮肤区域
//  拉伸完还是平坦。这里用的是反锐化蒙版(unsharp mask)算法——
//  结果 = 原图 + 强度×(原图-模糊版原图)，只放大"本来就存在的边缘和纹理"，
//  真正没有细节的地方不会凭空长出假纹理。
//  具体实现在页面顶部的隐藏SVG滤镜里（<filter id="unsharpMask">），
//  detailSlider 的值会实时改写该滤镜的 feComposite 参数。
// ══════════════════════════════════════════════════════════════════════

let detailSlider;         // 细节强化（0-100，默认35）
let unsharpKNode = null;  // 指向SVG滤镜里 <feComposite id="unsharpComposite"> 的DOM引用


// ══════════════════════════════════════════════════════════════════════

// ── updateJitter() ───────────────────────────────────────────────────
// 每帧在 smooth[] 更新后调用一次。
//
// ★★★ 关键修正：改用 pt(i) 的【屏幕坐标】，不再用 smooth[i] 的原始坐标 ★★★
//
// 为什么之前的版本不工作：
//   之前用 smooth[i].x/y 的原始 FaceMesh 坐标算 delta。
//   这些坐标没有经过 pt() 的 autoZoom × CONTRACT 变换。
//   如果 ml5.js FaceMesh 返回的是归一化坐标(0-1)，
//   一次眨眼的 delta ≈ 0.007，加权后 ≈ 0.015，
//   远低于 breakAt=0.9，永远触发不了断口。
//
// 正确做法：算 pt(i) 的屏幕坐标的帧间变化。
//   屏幕上眨眼 → 眼点移动约 8-15 屏幕像素 → delta≈3-5px（经过lerp缓冲后）→
//   加权2.2x → ≈7-11 → jitter≈1-2 → 超过 breakAt=2.2 时断开 ✓
//
// 性能：468次 pt() 调用 ≈ 468×10次加减乘除，在30fps下 < 0.1ms，完全可忽略。
function updateJitter(){
  if(!smooth || smooth.length === 0) return;
  let n = Math.min(smooth.length, 468);

  // 初始化（第一次有脸时，或脸的点数变化时）
  if(!pointJitter || pointJitter.length !== n){
    pointJitter  = new Float32Array(n);
    prevScreenXY = new Float32Array(n * 2);
    screenPxBuf  = new Float32Array(n * 2);
    // 用当前帧的屏幕坐标初始化"上一帧"，避免第一帧出现巨大跳跃
    for(let i = 0; i < n; i++){
      let p = pt(i);
      prevScreenXY[i*2]     = p.x;
      prevScreenXY[i*2 + 1] = p.y;
    }
    return;
  }

  // 如果 screenPxBuf 还没分配（文件重载等边缘情况），重新分配
  if(!screenPxBuf || screenPxBuf.length !== n * 2){
    screenPxBuf = new Float32Array(n * 2);
  }

  // ── 第一遍：把所有468个点的当帧屏幕坐标算出来，存进缓冲区 ──
  // 用 Float32Array 而不是每帧 new[]，避免垃圾回收暂停
  for(let i = 0; i < n; i++){
    let p = pt(i);
    screenPxBuf[i*2]     = p.x;
    screenPxBuf[i*2 + 1] = p.y;
  }

  // ── 第二遍：算全局平均头部位移（在屏幕坐标里）──
  // 歪头时所有468个点几乎以相同速度移动（刚体平移）→ 平均值 = 全局位移。
  // 减掉这个值，才能提取出"局部"相对运动（眨眼/说话）。
  let sumDx = 0, sumDy = 0;
  for(let i = 0; i < n; i++){
    sumDx += screenPxBuf[i*2]     - prevScreenXY[i*2];
    sumDy += screenPxBuf[i*2 + 1] - prevScreenXY[i*2 + 1];
  }
  let globalDx = sumDx / n;
  let globalDy = sumDy / n;

  // ── 第三遍：逐点算局部位移，加权，指数平滑 ──
  for(let i = 0; i < n; i++){
    let localDx = (screenPxBuf[i*2]     - prevScreenXY[i*2])     - globalDx;
    let localDy = (screenPxBuf[i*2 + 1] - prevScreenXY[i*2 + 1]) - globalDy;
    // 这里的 d 是屏幕像素，和画面直接挂钩——眨眼时眼点移动3-8屏幕px
    let d = Math.sqrt(localDx*localDx + localDy*localDy);

    // 眼睛×2.2、嘴唇×2.5，让这两个区域比歪头残余更容易触发断口
    let sensitivity = (i < JITTER_SENSITIVITY.length) ? JITTER_SENSITIVITY[i] : 1.0;

    // ★ 时间基指数平滑（EMA）
    // 原来固定写 0.85 × old + 0.15 × new，是"每帧权重15%"，帧率变了权重也变。
    // 时间基：把0.85这个"每帧衰减到85%"换算成"每单位时间衰减"：
    //   decayK = 0.85^(deltaTime/16.7)
    //   60fps(16.7ms): decayK = 0.85^1 = 0.850（和原来完全一样）
    //   20fps(50ms)  : decayK = 0.85^3 ≈ 0.614（旧值衰减更多，新值权重更大）
    // 效果：同一块肌肉做同一个动作，在任何帧率下看到的 jitter 峰值相同。
    let decayK = Math.pow(0.85, deltaTime / 16.7);
    pointJitter[i] = pointJitter[i] * decayK + d * sensitivity * (1 - decayK);

    // 同时更新"上一帧屏幕坐标"
    prevScreenXY[i*2]     = screenPxBuf[i*2];
    prevScreenXY[i*2 + 1] = screenPxBuf[i*2 + 1];
  }
}

  if (energySlider) energySlider.value(floor(energy));

  // OFFLINE / ONLINE 侦测：兼容新协议（isOnline boolean）和旧协议（status string）
  let isOfflineNow = (s.isOnline === false) || (s.status === 'OFFLINE');
  let wasOffline   = (prevIsOnline === true);   // prevIsOnline 存 isOfflineNow 的值

  if (isOfflineNow && !wasOffline) {
    // 从 ONLINE → OFFLINE（幂等：只在 ONLINE 时才触发，避免和 systemOffline 事件竞态）
    if (systemState === 'ONLINE') {
      energy = 0;
      captureFrozenFrame();
      systemState    = 'FREEZING';
      freezeStartTime = millis();
    }
  }
  if (!isOfflineNow && wasOffline) {
    // ★ 传入服务器的 energy 值，防止 setSystemOnline() 硬写 100 覆盖
    setSystemOnline(s.energy);
  }
  prevIsOnline = isOfflineNow;

  if (frameCount % 30 === 0) {

      + ' status=' + s.status
      + ' fx=' + (s.fx ? JSON.stringify(s.fx) : 'null'));
  }
});

// 简单亮度判断：背景色浅就用黑字，背景色深就用白字
function pickReadableTextColor(hex){
  let rgb = hexToRgbArr(hex);
  let lum = 0.299*rgb[0] + 0.587*rgb[1] + 0.114*rgb[2];
  return lum > 150 ? '#111' : '#eee';
}

// #RRGGBB → [R,G,B]
function hexToRgbArr(hex){
  hex = hex.replace('#','');
  return [
    parseInt(hex.substring(0,2), 16),
    parseInt(hex.substring(2,4), 16),
    parseInt(hex.substring(4,6), 16)
  ];
}


// ══════════════════════════════════════════════════════════════════════
//  pt() / ptFrom() / ptDrift() —— landmark索引 → 屏幕坐标
//
//  ptFrom(srcArr, i)：核心变换（收缩→居中→缩放），可以指定"从哪个数组
//  取原始坐标"——这是支持"漂移"效果的关键：漂移不是另一套变换逻辑，
//  只是把同一套变换应用在两个不同的原始坐标源上（实时 vs 滞后），
//  然后混合两者的结果。
//
//  pt(i)：正常情况下用，从实时的 smooth[] 取值（阶段1、和其他所有
//         非主线元素——视频/网格/遮罩/耳朵/头发都用这个，永远精准）
//
//  ptDrift(i, chaos)：阶段2专用，只在drawFace()构建主线路径时调用。
//         chaos=0时和pt(i)完全一样；chaos越大，越多混入"滞后位置"
//         + 越大的随机抖动——这就是"坐标延迟和漂移，像机器视觉抓瞎"。
// ══════════════════════════════════════════════════════════════════════

function ptFrom(srcArr, i){
  if(!srcArr[i]) return {x: viewCX(), y: viewCY()};
  let nose = smooth[1];

  let bx = lerp(srcArr[i].x, nose.x, CONTRACT);
  let by = lerp(srcArr[i].y, nose.y, CONTRACT);
  bx = bx - nose.x;
  by = by - nose.y;
  bx *= autoZoom;
  by *= autoZoom;
  // ★ 用 VIEW 定义的构图中心，不再写死 width/2, height/2
  return { x: bx + viewCX(), y: by + viewCY() };
}

function pt(i){
  return ptFrom(smooth, i);
}

function ptDrift(i, chaos){
  let real = ptFrom(smooth, i);

  // 没有任何漂移来源时，直接返回精准位置
  if(chaos <= 0 && currentDriftBaseline <= 0) return real;
  if(laggedSmooth.length <= i) return real;

  let lag = ptFrom(laggedSmooth, i);
  let bx = lerp(real.x, lag.x, chaos);
  let by = lerp(real.y, lag.y, chaos);

  // ★★★ 这一轮修正：漂移量用该点自身的 jitter 决定，不用全局 chaos*6 ★★★
  //
  // 之前：driftAmt = currentDriftBaseline + chaos * 6（所有点用同一个全局量）
  // 现在：driftAmt = currentDriftBaseline + jitter[i] * 0.8（每个点按自己的不稳定程度漂移）
  //
  // 这才是"测量"的含义：
  //   眼睛正在眨 → jitter[eye] 大 → 眼部线条漂移多
  //   嘴正在说话 → jitter[mouth] 大 → 嘴部线条漂移多
  //   额头静止    → jitter[forehead] ≈ 0 → 额头线条几乎不漂移
  let jitterVal = (pointJitter && i < pointJitter.length) ? pointJitter[i] : 0;
  let driftAmt = currentDriftBaseline + jitterVal * 0.8;
  driftAmt = Math.min(driftAmt, 14);  // 硬钳位：超过这个量线会飘出识别范围

  bx += (noise(i*0.37, frameCount*0.05) - 0.5) * driftAmt * 2;
  by += (noise(i*0.37+500, frameCount*0.05) - 0.5) * driftAmt * 2;

  return { x: bx, y: by };
}


// ══════════════════════════════════════════════════════════════════════
//  toSmoothPoly() —— 把索引列表变成密集的平滑折线
//
//  为什么不能直接用 beginShape + curveVertex？
//  因为 p5 的一个 shape 里 strokeWeight 不能中途改变。
//  而「手绘感」的核心恰恰是线宽在变（笔压）。
//
//  所以：先用 curvePoint() 自己把曲线算成密集点列，
//  再一段一段用 line() 画，每段单独设线宽。
//  → 既有曲线的顺滑，又有笔压的变化。
//
//  chaos 参数（默认0）：>0时用 ptDrift() 代替 pt()，让阶段2的主线
//  产生"坐标延迟和漂移"。耳朵/头发不会调用带chaos的版本，始终精准。
// ══════════════════════════════════════════════════════════════════════

function toSmoothPoly(indices, res, chaos=0){
  // 先取出实际坐标 + 加抖动
  // ★ 这一轮改动：chaos>0 或者 currentDriftBaseline>0 都要走 ptDrift()——
  // 之前只看 chaos>0，会漏掉"chaos=0但driftBaseline>0"这种情况
  // （阶段1看起来精准，但residue已经让线带一点基线漂移）
  let useDrift = chaos > 0 || currentDriftBaseline > 0;
  let raw = [];
  for(let n=0; n<indices.length; n++){
    let p = useDrift ? ptDrift(indices[n], chaos) : pt(indices[n]);
    if(WOBBLE > 0){
      let s = indices[n] * 0.31;
      p.x += (noise(s, frameCount*0.006) - 0.5) * WOBBLE * 2;
      p.y += (noise(s+77, frameCount*0.006) - 0.5) * WOBBLE * 2;
    }
    raw.push(p);
  }
  if(raw.length < 2) return [];

  // Catmull-Rom 插值（p5 的 curvePoint 就是这个）—— 完全不变
  let out = [];
  // ★ 这一轮新加：和 out 一一对应的"测量抖动值"数组，挂在返回数组上
  let jitOut = [];

  for(let i=0; i<raw.length-1; i++){
    let p0 = raw[max(0,i-1)];
    let p1 = raw[i];
    let p2 = raw[i+1];
    let p3 = raw[min(raw.length-1,i+2)];

    // 这一段原始折线两端点的抖动值，取较大者代表这一段的不稳定程度
    let idxA = indices[i], idxB = indices[i+1];
    let jA = (pointJitter && idxA < pointJitter.length) ? pointJitter[idxA] : 0;
    let jB = (pointJitter && idxB < pointJitter.length) ? pointJitter[idxB] : 0;
    let segJ = Math.max(jA, jB);

    for(let s=0; s<res; s++){
      let t = s/res;
      out.push({
        x: curvePoint(p0.x,p1.x,p2.x,p3.x,t),
        y: curvePoint(p0.y,p1.y,p2.y,p3.y,t)
      });
      jitOut.push(segJ);
    }
  }
  out.push(raw[raw.length-1]);
  jitOut.push(jitOut.length > 0 ? jitOut[jitOut.length-1] : 0);

  out.segJitter = jitOut;   // drawPressureLine() 会读这个来决定哪里断
  return out;
}


// ══════════════════════════════════════════════════════════════════════
//  drawPressureLine() —— 用变化的线宽画一条折线
//
//  这是「手绘感」的真正来源。
//  真人画线时手的压力在变：起笔轻、中段重、收笔轻，还有随机的抖。
//  用 noise 沿着线的长度调制线宽，就能模拟这个。
// ══════════════════════════════════════════════════════════════════════

function drawPressureLine(poly, baseW, seed, breakAt){
  if(poly.length < 2) return;
  let jit = poly.segJitter;   // 耳朵/头发这类没走toSmoothPoly的线没有这个数据（undefined）

  for(let i=0; i<poly.length-1; i++){

    // ★ 这一轮改动：断裂判断从噪声换成真实测量的抖动值
    //   之前：let gapNoise = noise(seed*3.7 + i*0.17); if(gapNoise > completeness) continue;
    //   现在：这一段对应的关键点，此刻真的在动吗？动得够多就断，不够就不断。
    //   没有 jit 数据的线（耳朵/头发）永远不断——保持精准，符合原设计。
    if(jit && jit[i] > breakAt) continue;

    let t = i / (poly.length-1);

    // 笔压曲线：起笔和收笔细，中段粗（不变）
    let taper = sin(t * PI) * 0.4 + 0.6;

    // 线宽的微抖动（笔压效果，和上面"是否断裂"的测量抖动是两回事，不变）
    let widthNoise = noise(seed + i*0.06) * 0.85 + 0.45;

    strokeWeight(1.0);   // ★ 恒定线宽，不许随位置变化
    line(poly[i].x, poly[i].y, poly[i+1].x, poly[i+1].y);
  }
}


// ══════════════════════════════════════════════════════════════════════
//  draw()
// ══════════════════════════════════════════════════════════════════════

function draw(){
  background(0);

  // ── 每帧更新所有滑块的数值显示（包括energy滑块）──
  if(window._sliderRefs){
    for(let k in window._sliderRefs){
      let ref = window._sliderRefs[k];
      // energy滑块比较特殊：它的数值由energy变量反向驱动（回升时滑块要跟着走），
      // 其他滑块正常情况是"滑块驱动数值"，这里统一用sl.value()显示已经足够，
      // 因为energySlider.value(...)在updateEnergySystem()里已经被同步过了
      ref.sp.html(ref.sl.value());
    }
  }

  // ══════════════════════════════════════════════════════════════════
  //  能量系统 + 状态机：整个视觉的总开关
  //  这个函数会更新 energy、判断要不要触发OFFLINE、推进冻结倒计时
  // ══════════════════════════════════════════════════════════════════
  updateEnergySystem();

  // ── OFFLINE：黑屏 + 文字，跳过所有正常绘制 ──
  if(systemState === 'OFFLINE'){
    drawOfflineScreen();
    return;
  }

  // ── FREEZING：冻结画面倒计时，跳过所有正常绘制 ──
  if(systemState === 'FREEZING'){
    drawFreezingScreen();
    return;
  }

  // ══════════════════════════════════════════════════════════════════
  //  以下是 systemState === 'ONLINE' 的正常绘制流程
  // ══════════════════════════════════════════════════════════════════

  // 根据当前energy值，算出这一帧三层视觉该用的参数
  let stage = getStageParams(energy, cycleProgress);
  // stage.videoAlpha : 视频层透明度（阶段1=fx上限，阶段2滑向下限）
  // stage.chaos      : 0-1，"衰竭强度"，驱动线漂移/网格断连/flash频闪

  // ★ 这一轮新加：把 fx 衍生出的参数同步进全局变量，
  // ptDrift()/drawMeshLayer()/drawFace() 直接读这几个全局值
  currentDriftBaseline   = stage.driftBaseline;
  currentMeshInstability = stage.meshInstability;
  currentFlashCeiling    = stage.flashCeiling;


  // Flash 衰减：每帧执行
  // ★ SWARM 接线：收到糖信号时把 flash 顶上去
  // ★ 时间基衰减（Time-based decay）
  //
  // 原来的写法 flashIntensity *= 0.92 是"每帧乘一次0.92"——帧率变了，衰减速度也变了。
  // 锁帧为20fps后，如果不改，一次flash原来约7帧(~117ms@60fps)降到0.5，
  // 现在只需4帧(200ms@20fps)就降到0.5，flash变快了30%，和设计完全脱节。
  //
  // 时间基公式：Math.pow(单帧衰减系数, deltaTime / 参考帧时长ms)
  //   deltaTime = p5.js 的内置变量，每帧更新，单位ms，表示"上一帧到这一帧过了多久"
  //   16.7ms    = 60fps 时的参考帧时长（让衰减系数的"标定"基准始终是60fps）
  //   Math.pow(0.92, deltaTime/16.7)：
  //     60fps(16.7ms) → Math.pow(0.92,1) = 0.920  （和原来完全一样）
  //     20fps(50ms)   → Math.pow(0.92,3) ≈ 0.779  （每帧乘三次，抵消慢帧）
  //
  // 结果：无论帧率是60还是20还是30，flash从1.0降到0.5始终约170ms——和帧率无关。
  const DT_REF = 16.7;  // 参考帧时长（ms），固定为60fps的倒数
  const DT     = deltaTime;  // p5.js 自动维护的当帧时长（ms）

  flashIntensity  = max(flashIntensity, sugarFlashPulse);
  sugarFlashPulse *= Math.pow(0.92,   DT / DT_REF);   // 脉冲：同一个系数，时间基版本
  flashIntensity  *= Math.pow(0.92,   DT / DT_REF);   // flash主体衰减
  if(flashIntensity < 0.001) flashIntensity = 0;

  // ★ 触摸拉回：flash 时短暂提升视频层亮度
  // flashIntensity=1.0 时 videoAlpha 最多被推高 30（但不超过阶段1上限 80）
  // 和 effectiveBreakAt 一起形成双重视觉拉回信号，确保 1.5m 外可见
  const flashVideoAlpha = min(LOCKED_VIDEO_ALPHA_S1,
                              stage.videoAlpha + flashIntensity * 30);
  // 视频层不依赖 FaceMesh 是否检测到脸——只要摄像头开着就能画。
  drawVideoLayer(flashVideoAlpha);

  if(!modelReady){
    fill(70); noStroke(); textAlign(CENTER,CENTER); textSize(15);
    text("FaceMesh 加载中……", viewCX(), viewCY());
    noFill(); drawHUD(stage); return;
  }

  if(faces.length === 0){
    fill(45); noStroke(); textAlign(CENTER,CENTER); textSize(14);
    text("请把脸移入画面", viewCX(), viewCY());
    noFill(); drawHUD(stage); return;
  }

  // ── 关键点平滑（低通滤波，消除 FaceMesh 的逐帧抖动）──
  //
  // ★ 时间基 lerp：1 - Math.pow(1-alpha_60fps, DT/DT_REF)
  // 原来固定系数 0.35 是"每帧追上35%"——帧率变了追赶速度也变了。
  // 20fps 时每帧50ms，如果还用0.35，每帧追的比60fps时多，
  // 平滑效果消失，关键点会抖动。
  //
  // 时间基公式把"每帧追赶速度"换算成"每单位时间追赶速度"：
  //   1 - Math.pow(1 - 0.35,  DT/16.7)
  //   60fps(16.7ms) → 1-0.65^1     = 0.35   (和原来完全一样)
  //   20fps(50ms)   → 1-0.65^(50/16.7) = 1-0.65^3 ≈ 0.725
  // 但 0.725 一步追太快——换一个更慢的原始系数：
  //   用 0.18 作为基准（每帧18%），等效60fps时追赶速度约半秒到位，
  //   在20fps时会自动补偿到同样的时间常数。
  // (注：原来0.35在60fps时半衰期约2帧≈33ms；0.18在60fps时半衰期约4帧≈67ms)
  // 保守一点让动作响应更清晰，展场时可在此处微调 k_smooth。
  const k_smooth = 0.25;   // 60fps基准：每帧追赶25%；时间基会自动换算
  let t_smooth = 1 - Math.pow(1 - k_smooth, DT / DT_REF);

  let kp = faces[0].keypoints;
  if(smooth.length !== kp.length){
    smooth = kp.map(p=>({x:p.x, y:p.y}));
  }else{
    for(let i=0;i<kp.length;i++){
      smooth[i].x = lerp(smooth[i].x, kp[i].x, t_smooth);
      smooth[i].y = lerp(smooth[i].y, kp[i].y, t_smooth);
    }
  }

  // ★ 这一轮新加：更新每个关键点的测量抖动值（供断裂判断用）
  updateJitter();

  // ── 阶段2专用：滞后跟随点（"坐标延迟和漂移"的来源）──
  if(laggedSmooth.length !== smooth.length){
    laggedSmooth = smooth.map(p=>({x:p.x, y:p.y}));
  }else{
    // lagLerp 也要时间基——阶段2深处追赶极慢(0.035)，正常(0.35)时靠近smooth
    let lagAlpha = map(stage.chaos, 0, 1, k_smooth, 0.035);
    let lagLerp  = 1 - Math.pow(1 - lagAlpha, DT / DT_REF);
    for(let i=0;i<smooth.length;i++){
      laggedSmooth[i].x = lerp(laggedSmooth[i].x, smooth[i].x, lagLerp);
      laggedSmooth[i].y = lerp(laggedSmooth[i].y, smooth[i].y, lagLerp);
    }
  }

  // ── 自动放大：让脸高稳定占屏幕的 VIEW.FH（42%）──
  let faceH = dist(smooth[10].x,smooth[10].y, smooth[152].x,smooth[152].y);
  let want = constrain(viewFH()/max(faceH,1), 0.5, 6.0);
  // autoZoom 的 lerp 也时间基——0.06在60fps时约1.5秒从1.0追到目标，时间基保持这个时间常数
  autoZoom = lerp(autoZoom, want, 1 - Math.pow(1 - 0.06, DT / DT_REF));

  // 三层顺序：视频（真实身体）→ 三角网格（系统原始数据）→ 优雅单线（美化输出）
  drawMeshLayer(stage.chaos);
  drawFace(stage.chaos);
  drawHUD(stage);

  // ★ index_test.html：临床进度条（压在最上层，总是可见）
  drawProgressBar();
}


// ══════════════════════════════════════════════════════════════════════
//  今天新加⑤：drawVideoLayer() —— 画降饱和、可调透明度的摄像头画面
//
//  ★ 对齐的关键理解 ★
//  pt() 做了三步变换，视频必须做完全相同的三步，才能和线描对齐：
//    ① 以鼻子坐标为原点（translate -nose）
//    ② 按 autoZoom 放大（scale autoZoom）
//    ③ 平移到画布中心（translate width/2, height/2）
//
//  而且还要做 ④ 正确的镜像。
//
//  旧版的错误：
//    image(video, 0,0, width,height) —— 把640×480拉伸到整个画布，
//    这和 pt() 的放大方式完全不同，所以怎么调都对不上。
//
//  新版的做法：
//    和 pt() 做同样的变换，视频在 640×480 原始分辨率下绘制（不拉伸），
//    由 autoZoom 决定在屏幕上占多大，由 nose 决定在哪里——和线描完全一致。
//
//  镜像的数学：
//    FaceMesh flipHorizontal:true 让坐标满足 x_mesh = 640 - x_raw。
//    要让视频像素 x_raw 出现在线描坐标 x_mesh 的位置，等价于：
//      x_out = -x_in + 640
//    用 canvas 变换实现：先 translate(640, 0)，再 scale(-1, 1)。
//    顺序重要！canvas 变换是后调用的先作用于点。
//    → scale 先作用：x → -x
//    → translate 后作用：-x → -x + 640  ✓
// ══════════════════════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════════════════════
//  ★★★ Energy 状态机核心函数 ★★★
// ══════════════════════════════════════════════════════════════════════


// ── 开关：要不要显现"过度使用"这条死法的预警 ──────────────────────────
// true  = 疯狂戳手机也会让脸开始不稳（更贴近"维持即抽干"，观众能看到代价）
// false = 这条路完全无预警，energy一直健康，第150次触摸时画面毫无征兆地猝死
const SHOW_OVERUSE_WARNING = true;

// ── getStageParams() ──────────────────────────────────────────────────
// 输入当前energy和cycleProgress，返回这一帧三层视觉该用的参数。
//
// server.js 里有两条通向 OFFLINE 的路，读了 server.js 才发现的：
//   ① energy归零（ENERGY_DECAY_PER_SEC=4，不摸自动衰减）——"被冷落死"
//   ② cycleTouches达到OFFLINE_TOUCH_THRESHOLD=150（不管energy多高）——"被摸死"
// 路①本来就在这个函数里（energy驱动的chaos）。
// 路②之前完全没接——因为每次触摸energy+6，只摸不停手时energy会一直健康，
// 但cycleProgress（=cycleTouches/threshold，服务器已经算好广播出来了）
// 在观众看不见的地方悄悄爬向1.0。这就是"观众以为在维持、其实在抽干"
// 真正发生的地方——之前这条路在屏幕上完全不可见。
//
//   energy ∈ [50,100] → 阶段1：videoAlpha=fx上限，chaos基线由fx决定
//   energy ∈ [10,50)  → 阶段2：videoAlpha从fx上限滑向下限，chaos从0升到1
//   energy ∈ [0,10)   → 阶段2末尾的最大衰竭状态，维持到energy=0触发OFFLINE
//   cycleProgress ∈ [0.6,1.0] → 如果开关打开，额外叠加一条独立的chaos来源
//   三条chaos来源取较大值——不管哪条路先到，视觉都跟着最严重的那条走
//
// ══════════════════════════════════════════════════════════════════════
//  ★★★ 这一轮新加：state.fx 消费逻辑 ★★★
//
//  关键理解（你反复强调的）：fx 不是替换当前值，是限制上限/基线。
//    videoAlphaCeiling → 阶段1时 videoAlpha 不再固定80，改成这个上限
//    confidenceFloor   → chaos 的最低基线（哪怕energy满格也不会完全精准）
//    driftBaseline     → 存进 currentDriftBaseline，供 ptDrift() 读
//    meshInstability   → 存进 currentMeshInstability，供 drawMeshLayer() 读
//    flashCeiling      → 存进 currentFlashCeiling，供 drawFace() 读
//
//  这样 residue（server 那边算出的"整场演出累积疲态"）越高：
//    residue=0   → 第一幕 videoAlpha 从 80 开始，全部精准
//    residue=0.6 → 第一幕 videoAlpha 只能到 48，线已经有轻微漂移，
//                  网格已经有低频抽搐——"最好状态"本身在变差
//
//  ★ 硬钳位：每个参数都先夹在一个"安全范围"里再使用。
//  没有这一步，residue=1 时如果所有效果叠加没有下限，
//  画面会变成不可读的噪点——那是"故障"（信息丢失），
//  不是我们要的"崩溃"（可辨认的衰竭）。安全范围的数字是
//  我们自己定的工程底线，不是原子测试锁定的美学参数，
//  之后如果手感不对可以调，但不能删掉这层保护。
// ══════════════════════════════════════════════════════════════════════
function getStageParams(e, cycleProgress){

  // fxParams 是 socket.io 的 state 事件里赋值的全局变量。
  // 还没连上服务器（本地用T/R键测试）时 fxParams 是 null，
  // 这时候全部退回旧的固定值，保证本地测试不受影响。
  let fx = fxParams;

  // ── 硬钳位：不管服务器发来什么数字，先按安全范围夹一遍 ──
  let videoAlphaCeiling = fx ? constrain(fx.videoAlphaCeiling, 15, 255)   : LOCKED_VIDEO_ALPHA_S1;
  let confidenceFloor   = fx ? constrain(fx.confidenceFloor,   0,  0.70) : 0;
  let driftBaseline      = fx ? constrain(fx.driftBaseline,     0,  10)   : 0;
  let meshInstability    = fx ? constrain(fx.meshInstability,   0,  0.35) : 0;
  let flashCeiling       = fx ? constrain(fx.flashCeiling,      0.05, 1.0): 1.0;

  // 阶段2的下限也要保证不高于上限——万一 videoAlphaCeiling 被 residue
  // 压得很低（比如15），不能让"下限"反而比"上限"还大，那样滑动方向会反过来
  let s2Floor = Math.min(LOCKED_VIDEO_ALPHA_S2_FLOOR, videoAlphaCeiling);

  let videoAlpha, chaosFromNeglect;
  if(e >= 50){
    // ★ 之前固定写 LOCKED_VIDEO_ALPHA_S1(80)，现在改成 fx 给的上限
    videoAlpha = videoAlphaCeiling;
    chaosFromNeglect = 0;
  }else if(e >= 10){
    // 阶段2的滑动范围跟着上限走，不再停留在旧的固定80
    videoAlpha = map(e, 50, 10, videoAlphaCeiling, s2Floor);
    chaosFromNeglect = map(e, 50, 10, 0, 1);
  }else{
    videoAlpha = s2Floor;
    chaosFromNeglect = 1;
  }

  // ★★★ 双轴解耦：cycleProgress 不再驱动 chaos ★★★
  //
  //  旧设计：cycleProgress > 0.6 → chaosFromOveruse 升高 → 画面混乱
  //           含义："观众点越多 → 画面越糟" ——与进度条正反馈矛盾
  //
  //  新设计（双轴分离）：
  //    cycleProgress → 控制 Crystal Mesh 三角面完整度（在 drawCrystalMesh 里）
  //    energy        → 控制"诊断信号稳定性"（发丝漂移、切片微震）
  //
  //  chaos 现在只由 energy 衰减驱动，代表"你停止点击时画面开始衰败"，
  //  但不削减观众已经拼合的面部结构（skipBase 由 cycleProgress 保住）。
  let chaos = max(chaosFromNeglect, confidenceFloor);
  chaos = constrain(chaos, 0, 1);

  return {
    videoAlpha,
    chaos,
    driftBaseline,
    meshInstability,
    flashCeiling
  };
}


// ── onTouch() ────────────────────────────────────────────────────────
// 这是"一次触摸"的完整效果：flash + 消耗能量。
// 现在：键盘 T 键手动调用，模拟一次观众触摸
// 之后：socket.io 的 'triggerSugar'（或server发来的touch事件）会调用这个函数，
//       到时候 ENERGY_DRAIN_PER_TOUCH 这个本地占位值会被server算出的真实值取代
//       ——但函数签名和调用方式不用变，接socket时只要在事件回调里调 onTouch() 就行。
function onTouch(){
  triggerFlash();
  energy = constrain(energy - ENERGY_DRAIN_PER_TOUCH, 0, 100);
  lastEnergyActionTime = millis();
  if(energySlider) energySlider.value(floor(energy));
}


// ── updateEnergySystem() ─────────────────────────────────────────────
// 每帧调用。
//
// ★★★ 2026-08-02 接口变更 ★★★
// energy 的含义已经改变：
//   旧：energy <= 0 → 触发崩溃
//   新：energy 只驱动画面的"消退强弱"（videoAlpha / chaos），
//       不再是任何崩溃开关。
// 崩溃只有一个来源：服务器的 systemOffline 事件。
// 任何窗口都不许写"energy 归零就崩溃"这类逻辑。
function updateEnergySystem(){
  if(systemState === 'ONLINE'){

    // 被动回升：距离上次触摸/手动设置超过 ENERGY_REGEN_DELAY_MS，才开始回升
    if(millis() - lastEnergyActionTime > ENERGY_REGEN_DELAY_MS){
      energy = min(100, energy + ENERGY_REGEN_PER_SEC / 20);  // 20fps，每帧回升一点点
      if(energySlider) energySlider.value(floor(energy));
    }

    // ★ 已删除：energy <= 0 → captureFrozenFrame() → FREEZING
    // 不允许写这类逻辑。崩溃由 systemOffline 事件触发，不由 energy 决定。

  }else if(systemState === 'FREEZING'){
    if(millis() - freezeStartTime > FREEZE_DURATION_MS){
      console.log('[SWARM] ★ 冻结时间到，切换到 OFFLINE 黑屏');
      systemState = 'OFFLINE';
    }
  }
  // systemState === 'OFFLINE'：什么都不做，停在这里，
  // 等外部调用 setSystemOnline()（之后是socket的'systemOnline'事件）
}


// ── captureFrozenFrame() ─────────────────────────────────────────────
// systemOffline 事件到达时调用：把videoLayer此刻的画面复制进 frozenFrame，
// 并把 deathAlpha 设到初始值。
// ★ 这个函数只能由 systemOffline 事件触发，不能由 energy 归零触发。
function captureFrozenFrame(){
  frozenFrame.clear();
  frozenFrame.image(videoLayer, 0, 0);
  deathAlpha = FREEZE_FRAME_ALPHA / 255;   // 从已锁定的冻结帧透明度开始（≈0.51）
}


// ── drawFreezingScreen() ─────────────────────────────────────────────
// FREEZING阶段（2.5秒倒计时期间）：
//   - 显示 frozenFrame，透明度按时间基公式缓慢衰减
//   - 不画网格/线/flash——一切"冻结然后消失"，只剩疲惫的脸
//   - 衰减有下限 0.10：到了这里就停住，不会彻底变黑
function drawFreezingScreen(){
  background(0);
  if(frozenFrame){
    // ── 时间基衰减：公式和用户规格完全一致 ──
    // Math.pow(0.985, deltaTime/16.7)：
    //   60fps(16.7ms) → 0.985^1    ≈ 0.985（每帧衰减1.5%）
    //   20fps(50ms)   → 0.985^3    ≈ 0.956（每帧衰减4.4%，3帧合一，等效相同时间常数）
    //   从0.51降到0.10大约需要：ln(0.10/0.51)/ln(0.985) ≈ 107帧 ≈ 5.3秒（60fps基准）
    //   在20fps下：同样5.3秒——时间常数和帧率无关 ✓
    deathAlpha = Math.max(0.10, deathAlpha * Math.pow(0.985, deltaTime / 16.7));

    push();
    tint(255, deathAlpha * 255);   // 0.10 = tint(255,25.5)，驻留残影
    image(frozenFrame, 0, 0);
    noTint();
    pop();
  }

  // 倒计时调试标记（展演前可删）
  push();
  noStroke();
  fill(0,0,0,180); rect(15, 15, 260, 30, 4);
  fill(255,180,80); textAlign(LEFT,TOP); textSize(15); textFont('monospace');
  let remain = max(0, FREEZE_DURATION_MS - (millis()-freezeStartTime));
  text("● FREEZING... " + (remain/1000).toFixed(1) + "s", 24, 22);
  pop();
}


// ── drawOfflineScreen() ───────────────────────────────────────────────
// OFFLINE状态（进入纯黑+文字阶段后）：
//   - 残影（frozenFrame）以 deathAlpha 继续驻留在背景，直到 systemOnline 重置
//   - deathAlpha 在此继续衰减，但下限 0.10 保证残影不会完全消失
//   - SYSTEM OFFLINE 文字叠在残影之上
function drawOfflineScreen(){
  background(0);

  // ── 残影：以当前 deathAlpha 持续显示，继续缓慢衰减 ──
  if(frozenFrame && deathAlpha > 0){
    // 继续按时间基公式衰减（FREEZING阶段和OFFLINE阶段共用同一条衰减曲线）
    deathAlpha = Math.max(0.10, deathAlpha * Math.pow(0.985, deltaTime / 16.7));

    push();
    tint(255, deathAlpha * 255);   // 0.10时=tint(255,25.5)，极淡但仍可辨认
    image(frozenFrame, 0, 0);
    noTint();
    pop();
  }

  // ── SYSTEM OFFLINE 文字 ──
  push();

  // ★ 严禁 glow/shadow
  drawingContext.shadowBlur  = 0;
  drawingContext.shadowColor = 'transparent';

  noStroke();
  fill('#C8C8C8');          // 不是纯白，是 #C8C8C8
  textFont('monospace');

  let sz = max(12, height * 0.012);
  textSize(sz);

  let textX = viewFaceLeft();
  let textY = viewCY() + viewFH() * 0.5 + sz * 1.5;

  textAlign(LEFT, TOP);
  text('SYSTEM OFFLINE', textX, textY);

  pop();
}


// ── setSystemOnline() ─────────────────────────────────────────────────
// ★★★ Task 1 修复：接受服务器传来的 energy 值，不再硬写 100 ★★★
//
// 原问题：每次 OFFLINE 恢复后，state 事件设 energy=50（服务器值），
// 但同一事件处理器随后调用 setSystemOnline() → energy=100，覆盖了服务器值。
// 结果：以触摸维持系统时 energy 稳定在 100，getStageParams(100,0) = Stage 1，
// 观众看到"回到第一阶段"的视觉，即使已经是第二、三轮。
//
// 修复：
//   - setSystemOnline(recoveryEnergy) 使用传入的 energy 值
//   - 无参数调用（sessionReset、R 键）保持 100（符合"整场重置"的语义）
//   - systemOnline 和 state 事件都传入 d.energy（来自服务器的周期衰减值）
function setSystemOnline(recoveryEnergy) {
  systemState = 'ONLINE';
  // ★ 使用服务器提供的恢复 energy（随周期递减：cycle1=42, cycle2=34...）
  // 无参数 = sessionReset 或键盘R = 100（整场重置语义正确）
  energy = (typeof recoveryEnergy === 'number') ? recoveryEnergy : 100;
  flashIntensity = 0;
  deathAlpha = 0;            // ★ 清零残影——systemOnline 或 sessionReset 时才清零
  if(energySlider) energySlider.value(floor(energy));
  lastEnergyActionTime = millis();
}


// ══════════════════════════════════════════════════════════════════════
//  triggerFlash() —— 触摸事件触发的线描闪亮（阶段1：单次冷白过曝）
//
//  现在：T 键（通过onTouch()）或直接调用来手动测试
//  7/19 之后：socket.io 的 'triggerSugar' 事件通过 onTouch() 调用这个函数
//
//  调用一次 → flashIntensity 跳回1.0 → draw()里每帧×0.92衰减
//  阶段2时，drawFace()里会在这个基础上再叠加"不稳定频闪"的随机调制
// ══════════════════════════════════════════════════════════════════════

function triggerFlash(){
  flashIntensity = 1.0;
}


function drawVideoLayer(videoAlphaTarget){
  let a = videoAlphaTarget;
  if(a <= 0) return;
  if(smooth.length < 2) return;   // 没检测到脸 = 没有遮罩中心 = 不画

  let nose = smooth[1];

  // ══════════════════════════════════════════════════════════════════
  //  ① 把摄像头画到低分辨率画布（默认192×192）
  //
  //  为什么不直接画全分辨率再缩小：低分辨率+最近邻放大才会产生硬像素块，
  //  这就是"机器视野"的像素感来源。全分辨率再缩小会被抗锯齿磨平，
  //  看起来还是普通相机。
  // ══════════════════════════════════════════════════════════════════

  if(!lowRes) return;   // 防御：setup()还没跑完时不崩溃
  let curSize = lowRes.width;

  // 强制灰度画到小画布上（方便后面的像素操作只看一个通道）
  lowRes.drawingContext.filter = 'grayscale(1)';
  lowRes.image(video, 0, 0, curSize, curSize);
  lowRes.drawingContext.filter = 'none';


  // ══════════════════════════════════════════════════════════════════
  //  ② 像素量化：黑场压制 + N级灰阶
  //
  //  loadPixels() 把小画布的像素读进一个数组：每4个数字=1个像素的
  //  [R,G,B,Alpha]。灰度图 R=G=B，只看 px[i] 就知道亮度。
  //
  //  黑场压制（QUANT_FLOOR=34）：亮度低于34的像素直接变纯黑，
  //  消除噪底，让暗部真正是黑，不是"50度灰"。
  //
  //  量化：把0-255的连续灰度强制对齐到N个固定级别。
  //    4级 = [0, 85, 170, 255]（默认）
  //    3级 = [0, 128, 255]（更抽象）
  //    6级 = [0,51,102,153,204,255]（接近照片）
  // ══════════════════════════════════════════════════════════════════

  let levels = quantSlider ? quantSlider.value() : 4;
  let step = 255 / (levels - 1);   // 相邻两级之间的亮度间距

  lowRes.loadPixels();
  let px = lowRes.pixels;

  for(let i = 0; i < px.length; i += 4){
    let lum = (0.299 * px[i] + 0.587 * px[i+1] + 0.114 * px[i+2]) | 0;

    let quantized;
    if(lum < QUANT_FLOOR){
      quantized = 0;   // 黑场压制
    }else{
      // 取整到最近的量化级别，再乘回 step 得到实际亮度值
      quantized = Math.round(lum / step) * step;
      quantized = Math.min(255, Math.max(0, quantized)) | 0;
    }

    px[i]   = quantized;
    px[i+1] = quantized;
    px[i+2] = quantized;
    // px[i+3]（Alpha）不动
  }

  lowRes.updatePixels();   // 把修改过的数组写回画布


  // ══════════════════════════════════════════════════════════════════
  //  ③ 最近邻放大到视频层，同时应用和 pt() 相同的5步坐标变换
  //
  //  为什么用最近邻（noSmooth + imageSmoothingEnabled=false）：
  //  默认插值会把像素块的硬边磨模糊，又变回"调暗的自拍"。
  //  最近邻让每个低分辨率像素放大后保持清晰的硬色块。
  // ══════════════════════════════════════════════════════════════════

  videoLayer.clear();
  videoLayer.push();

  // 5步变换（和 pt() 完全相同，保证视频和线描精确对齐）
  videoLayer.translate(viewCX(), viewCY());    // ★ 用 VIEW 定义的构图中心
  videoLayer.scale(autoZoom, autoZoom);
  videoLayer.translate(-nose.x, -nose.y);
  videoLayer.translate(640, 0);
  videoLayer.scale(-1, 1);

  // ★ 禁止插值：两行都要写，确保不同浏览器版本都生效
  videoLayer.noSmooth();
  videoLayer.drawingContext.imageSmoothingEnabled = false;

  // 亮度/对比度/细节强化在这里叠加（CSS filter，GPU执行，不影响帧率）
  let D = map(detailSlider.value(), 0, 100, 0, 0.85);
  let B = map(brightSlider.value(),   0, 100, 0.0, 1.0).toFixed(2);
  let finalC = (map(contrastSlider.value(), 0, 100, 0.2, 1.2) + D).toFixed(2);
  videoLayer.drawingContext.filter = `brightness(${B}) contrast(${finalC})`;
  // 注意：不用再写 grayscale(1)，第①步已经做过了

  // 把 curSize×curSize 的低分辨率图拉伸到640×480（配合上面5步变换的坐标系）
  // 禁止插值后，每个低分辨率像素会放大成约 (640/curSize) 像素宽的色块
  videoLayer.image(lowRes, 0, 0, 640, 480);

  videoLayer.drawingContext.filter = 'none';
  videoLayer.drawingContext.imageSmoothingEnabled = true;   // 复位，避免影响其他绘制

  videoLayer.pop();

  // ─── 噪点颗粒：画进 videoLayer 缓冲区里（不是主画布）───────
  // 这样噪点会和视频一起被下面的 applyFaceMask() 裁掉脸外的部分
  drawGrainInto(videoLayer, a);

  // ─── 遮罩：只留脸部区域，其余压黑 ────────────────────────────
  applyFaceMask(videoLayer);

  // ─── 叠加到主画布 ──────────────────────────────────────────────
  push();
  tint(255, a);
  image(videoLayer, 0, 0);
  noTint();
  pop();
}


// ══════════════════════════════════════════════════════════════════════
//  drawGrainInto() —— 动态噪点颗粒，画进指定的缓冲区
//
//  和之前版本的区别：以前直接画在主画布上，现在画进 videoLayer 缓冲区，
//  这样噪点会跟着视频一起被 applyFaceMask() 裁剪，天然只出现在脸部范围内，
//  不需要额外写"噪点专属遮罩"的逻辑。
//
//  为什么 SCREEN 混合模式：
//   SCREEN = 1-(1-a)(1-b)。噪点亮的地方让底层稍微亮一点，暗的地方不影响。
//   效果像"传感器过载的亮点"，比 OVERLAY 更接近电子噪声的质感。
// ══════════════════════════════════════════════════════════════════════

function drawGrainInto(buf, videoAlpha){
  let g = grainSlider.value();      // 0-50
  if(g <= 0 || videoAlpha <= 0) return;

  let maxAlpha = map(g, 0, 50, 0, 200) * (videoAlpha / 255);

  noiseImg.loadPixels();
  let px = noiseImg.pixels;
  for(let i = 0; i < px.length; i += 4){
    let v = random(256) | 0;
    px[i]   = v;
    px[i+1] = v;
    px[i+2] = v;
    px[i+3] = (random(maxAlpha)) | 0;
  }
  noiseImg.updatePixels();

  buf.push();
  buf.blendMode(SCREEN);
  buf.image(noiseImg, 0, 0, width, height);   // 128×96 → 全屏，颗粒感来自低分辨率拉伸
  buf.blendMode(BLEND);
  buf.pop();
}


// ══════════════════════════════════════════════════════════════════════
//  applyFaceMask() —— 把缓冲区裁剪成"只留脸部区域，其余透明"
//
//  原理不变：globalCompositeOperation = 'destination-in'——
//  只保留新画的形状和已有内容重叠的部分。三种模式只是"剪刀的形状"不同：
//
//  MASK_MODE 0 柔边椭圆（旧版）：径向渐变，边缘大范围羽化 → 读起来像鬼影
//  MASK_MODE 1 跟随脸部轮廓（这一轮默认）：用FACE_OVAL_IDX的36个landmark
//              连成多边形，只加几像素的模糊做"极窄过渡"，不是大范围晕影
//  MASK_MODE 2 矩形硬边画框：脸部包围盒，完全不羽化，纯几何硬边
//
//  三种模式共用 maskSlider 控制"范围大小"（椭圆半径 / 轮廓外扩比例 /
//  矩形外扩比例），语义略有不同但都是"越大越宽松"。
// ══════════════════════════════════════════════════════════════════════

function applyFaceMask(buf){
  buf.push();
  buf.drawingContext.globalCompositeOperation = 'destination-in';

  if(MASK_MODE === 0){
    // ── 模式0：柔边椭圆（旧版逻辑，保留用于对比）──
    let baseR = viewFH() * 0.62;
    let maskR = baseR * (maskSlider.value()/100);

    buf.translate(viewCX(), viewCY());
    buf.scale(1.0, 1.32);

    let grad = buf.drawingContext.createRadialGradient(0, 0, maskR*0.35, 0, 0, maskR);
    grad.addColorStop(0,    'rgba(255,255,255,1)');
    grad.addColorStop(0.75, 'rgba(255,255,255,1)');
    grad.addColorStop(1,    'rgba(255,255,255,0)');

    buf.drawingContext.fillStyle = grad;
    buf.drawingContext.fillRect(-width*2, -height*2, width*4, height*4);

  }else if(MASK_MODE === 1){
    // ── 模式1：跟随脸部轮廓（硬边+极窄过渡，不是大范围晕影）──
    //
    // 用 FACE_OVAL_IDX 的36个点连成多边形，以自身重心为基准，
    // 按 maskSlider 的比例整体外扩/内缩（100=贴着landmark原始轮廓，
    // >100=往外扩一点留出安全边距，<100=往内收）。
    let pts = FACE_OVAL_IDX.map(i => pt(i));
    let cx = 0, cy = 0;
    for(let p of pts){ cx += p.x; cy += p.y; }
    cx /= pts.length; cy /= pts.length;

    let scaleF = maskSlider.value() / 100;

    // 只加3px模糊做"极窄过渡"——比柔边椭圆的大范围渐变窄得多，
    // 既不是完全锯齿的硬边，也不会读成"晕影"
    buf.drawingContext.filter = 'blur(3px)';
    buf.noStroke();
    buf.fill(255);
    buf.beginShape();
    for(let p of pts){
      let ex = cx + (p.x - cx) * scaleF;
      let ey = cy + (p.y - cy) * scaleF;
      buf.vertex(ex, ey);
    }
    buf.endShape(CLOSE);
    buf.drawingContext.filter = 'none';

  }else{
    // ── 模式2：矩形硬边画框（完全无羽化）──
    let pts = FACE_OVAL_IDX.map(i => pt(i));
    let xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
    let minX = Math.min(...xs), maxX = Math.max(...xs);
    let minY = Math.min(...ys), maxY = Math.max(...ys);
    let cx = (minX+maxX)/2, cy = (minY+maxY)/2;
    let scaleF = maskSlider.value() / 100;
    let hw = (maxX-minX) * scaleF / 2;
    let hh = (maxY-minY) * scaleF / 2;

    buf.noStroke();
    buf.fill(255);
    buf.rect(cx-hw, cy-hh, hw*2, hh*2);   // 纯矩形，没有blur，没有渐变
  }

  buf.pop();   // pop 会自动恢复 globalCompositeOperation，不用手动复位
}


// ══════════════════════════════════════════════════════════════════════
//  computeMeshEdges() —— 计算"哪两个landmark点算相邻"
//
//  做法：468个点两两算距离，小于阈值的记一条边。
//  这是"邻近点连线"，不是MediaPipe官方的三角剖分表——原因见上面
//  变量声明处的说明：官方表有2000多个索引，我没办法保证凭记忆
//  完整写对，写错的连线比没有更误导人。这个替代方案视觉上同样是
//  密集的网状结构，而且性能已经在7/18测试中验证过（14168条边时
//  仍有61.7fps）。
//
//  只在必要时重新计算（每3秒一次），不是每帧都算：
//  468×468≈22万次距离比较，虽然不算贵，但没必要每帧都做。
// ══════════════════════════════════════════════════════════════════════

function computeMeshEdges(){
  meshEdges = [];
  let threshSq = pow(MESH_DIST_PX * autoZoom, 2);   // 阈值跟着autoZoom缩放，脸大网格也跟着变密

  let P = [];
  for(let i=0; i<468; i++) P.push(pt(i));

  for(let i=0; i<P.length; i++){
    for(let j=i+1; j<P.length; j++){
      let dx = P[i].x - P[j].x, dy = P[i].y - P[j].y;
      if(dx*dx + dy*dy < threshSq) meshEdges.push([i,j]);
    }
  }
}


// ══════════════════════════════════════════════════════════════════════
//  drawMeshLayer() —— 画原始三角网格层（中间层，视频和优雅单线之间）
//
//  性能优化说明（对应你问的"太耗性能怎么办"）：
//  如果 FPS 掉下来了，把顶部 MESH_SKIP 常量从 1 改成 2 或 3：
//    MESH_SKIP=1 → 画全部边（默认，最密）
//    MESH_SKIP=2 → 隔一条画一条（边数减半，视觉上网格变稀疏但仍然密集）
//    MESH_SKIP=3 → 画三分之一
//  这是最简单粗暴但最有效的优化——不改变算法，只是跳着画。
// ══════════════════════════════════════════════════════════════════════

function drawMeshLayer(chaos){
  // mPct 不再是滑块——网格alpha现在是锁定常量 LOCKED_MESH_ALPHA(30)
  if(smooth.length < 2) return;

  // 邻接关系每3秒重算一次，位置每帧都用当前的pt()重新取，跟手实时
  if(!meshEdges || millis() - lastMeshCompute > MESH_RECOMPUTE_MS){
    computeMeshEdges();
    lastMeshCompute = millis();
  }
  if(!meshEdges || meshEdges.length === 0) return;

  meshLayer.clear();
  meshLayer.stroke(160, 205, 255, 255);
  meshLayer.strokeWeight(LOCKED_MESH_WIDTH);   // 锁定0.5px，不再随alpha变化
  meshLayer.noFill();

  // ── 阶段2：网格"抽搐式断裂和重连"（不是变粗/变淡，是接触不良）──
  // 做法：chaos越大，每条边这一帧被随机跳过（本帧不画）的概率越高。
  // 因为每帧概率独立重新掷骰子，视觉上就是网格在闪烁断开又重新连上，
  // 像接触不良的电路，而不是均匀地变淡。
  //
  // ★ 这一轮改动：dropoutProb 现在是"基线 + chaos驱动的部分"。
  // currentMeshInstability 来自 fx.meshInstability——哪怕 chaos=0
  // （阶段1看起来精准），只要 residue 累积够了，网格也会有低频抽搐，
  // 这是最健康的时刻也藏不住的"整场演出疲态"。
  let dropoutProb = currentMeshInstability + chaos * 0.55;
  dropoutProb = Math.min(dropoutProb, 0.85);  // 硬钳位：超过85%网格基本消失，读不出"这是一层网格"

  for(let e=0; e<meshEdges.length; e+=MESH_SKIP){
    if(dropoutProb > 0 && random() < dropoutProb) continue;  // "接触不良"：这条边这一帧断开
    let a = pt(meshEdges[e][0]), b = pt(meshEdges[e][1]);
    meshLayer.line(a.x, a.y, b.x, b.y);
  }

  applyFaceMask(meshLayer);   // 同一把"剪刀"，裁成只留脸部区域

  push();
  tint(255, LOCKED_MESH_ALPHA);   // 锁定常量30，不再是滑块
  image(meshLayer, 0, 0);
  noTint();
  pop();
}


// ══════════════════════════════════════════════════════════════════════
//  drawFace() —— 两遍绘制
//   第一遍：辉光（一整条 shape，粗、淡、shadowBlur）
//   第二遍：主线（逐段变宽，无 shadowBlur，性能才够）
// ══════════════════════════════════════════════════════════════════════

function drawFace(chaos){
  // chaos: 0-1，来自 energy 状态机的 getStageParams()。
  // 0 = 阶段1（完全精准，无漂移无频闪）；越接近1 = 阶段2越深的衰竭。
  noFill();

  // 断裂阈值：屏幕像素单位（updateJitter 现在用 pt() 的屏幕坐标）
  //   pathologyLevel=0（阶段1）→ breakAt=1.2：正常眨眼/说话就能断，静止不断
  //   pathologyLevel=1（阶段2）→ breakAt=0.4：极轻微抖动就断，线条支离破碎
  //
  // 注：把原来的2.2改到1.2，因为实测下来jitter值约在0.5-3px范围，
  //     2.2会让"只有用力眨眼才断"，1.2让"轻松眨眼就断"，手感更清晰。
  let pathologyLevel = chaos;
  let breakAt = 1.2 - pathologyLevel * 0.8;
  breakAt = Math.max(0.15, breakAt);
  lastBreakAt = breakAt;

  // ★ 触摸拉回：flash 高时提高 breakAt，强制闭合碎裂线条
  //
  // 工作原理：drawPressureLine() 里 jit[i] > breakAt 时跳过该段（= 断线）。
  // breakAt 提高后，之前因抖动而断开的段会重新连上——线条"拉回愈合"。
  //
  // flashIntensity=1.0 → effectiveBreakAt 提高 0.8，接近阶段1的完全精准状态
  // flashIntensity=0   → effectiveBreakAt = breakAt，不影响正常衰退逻辑
  //
  // 这是因果链的视觉锚点：观众触摸 → 画面瞬间从碎裂中恢复 → 停手 → 重新碎裂。
  const effectiveBreakAt = breakAt + flashIntensity * 0.8;

  // ── Flash 强度 ──
  // 阶段1（chaos=0）：flashIntensity 原样使用，单次触摸=100%强度冷白过曝
  // 阶段2（chaos>0）：叠加"不稳定随机频闪"——不是单调衰减，而是不规则跳动
  let flashFactor = flashIntensity;
  if(chaos > 0){
    let flicker = 0.15 + noise(frameCount*0.6, 77) * 1.6;  // 大约0.15~1.75之间浮动
    flashFactor *= lerp(1, flicker, chaos);
  }

  // ★ 这一轮新加：flash 强度上限
  // currentFlashCeiling 来自 fx.flashCeiling——residue 累积越多，
  // 系统"能亮起来的程度"越差，哪怕触摸信号本身是满格的flashIntensity=1。
  // 硬钳位下限0.05已经在 getStageParams() 里做过了，这里不用再夹，
  // 只需要把 flashFactor 限制在这个上限以内。
  flashFactor = Math.min(flashFactor, currentFlashCeiling);

  // 辉光强度（还没锁定，继续用滑块）
  let glowFactor = glowSlider.value() / 100;

  // ── 颜色逻辑——自定义纯色（按钮：冷白/纯白） vs 渐变色板（1/2/3键，调试用）──
  let strokeStyleValue, glowColorStr;
  if(customColor){
    strokeStyleValue = `rgb(${customColor[0]},${customColor[1]},${customColor[2]})`;
    glowColorStr      = `rgba(${customColor[0]},${customColor[1]},${customColor[2]},0.75)`;
  }else{
    let P = PALETTES[PALETTE];
    let g = drawingContext.createLinearGradient(0, height*0.18, 0, height*0.85);
    g.addColorStop(0,    `rgb(${P.stops[0]})`);
    g.addColorStop(0.45, `rgb(${P.stops[1]})`);
    g.addColorStop(1,    `rgb(${P.stops[2]})`);
    strokeStyleValue = g;
    glowColorStr      = P.glow;
  }

  // 先把所有要画的折线算出来（算一次，两遍绘制共用）
  // 注意：主脸部路径传入 chaos，让阶段2产生"坐标延迟和漂移"；
  // 耳朵/头发不传chaos（内部走pt()而非toSmoothPoly，本来就不受影响）。
  let polys = [];

  if(SHOW_TRAVEL){
    polys.push({ poly: toSmoothPoly(PATH_BASE, 5, chaos), w: LINE_W, seed: 1 });
  }else{
    const SEGS = [
      PATH_BASE.slice(0,37), PATH_BASE.slice(37,42), PATH_BASE.slice(42,49),
      PATH_BASE.slice(49,54), PATH_BASE.slice(54,60), PATH_BASE.slice(60,66),
      PATH_BASE.slice(66,73), PATH_BASE.slice(73,94), PATH_BASE.slice(94)
    ];
    for(let s=0;s<SEGS.length;s++){
      polys.push({ poly: toSmoothPoly(SEGS[s],5, chaos), w: LINE_W, seed: s*13+1 });
    }
  }

  if(DETAIL >= 1){
    for(let k=0;k<PATH_D1.length;k++)
      polys.push({ poly: toSmoothPoly(PATH_D1[k],5, chaos), w: LINE_W*0.62, seed: 200+k*9 });
  }
  if(DETAIL >= 2){
    for(let k=0;k<PATH_D2.length;k++)
      polys.push({ poly: toSmoothPoly(PATH_D2[k],5, chaos), w: LINE_W*0.48, seed: 400+k*9 });
  }

  // 耳朵、头发：不受chaos影响，始终精准（简化设计，见函数顶部说明）
  if(SHOW_EARS){
    polys.push({ poly: earPoly(234,false,chaos), w: LINE_W*0.85, seed: 610 });
    polys.push({ poly: earPoly(454,true,chaos),  w: LINE_W*0.85, seed: 640 });
  }
  if(SHOW_HAIR){
    let hs = hairPolys();
    for(let k=0;k<hs.length;k++)
      polys.push({ poly: hs[k], w: LINE_W*0.7, seed: 800+k*17 });
  }


  // ══ ★ index_test.html 专用：结晶面片层 ══
  // 在辉光遍之前画，确保：
  //   · 填充三角形不受 shadowBlur 污染（结晶是临床硬边，不是发光物体）
  //   · 压在辉光和发丝线下方，形成"3D 几何 → 发光 → 精密标注"三层叠加结构
  //   · effectiveBreakAt 与发丝线共享，断裂同步（耳区、面部统一）
  if (SHOW_CRYSTAL_MESH) {
    drawingContext.shadowBlur = 0;   // 确保结晶层不受下方或上方的 shadowBlur 影响
    drawCrystalMesh(pathologyLevel, flashIntensity, effectiveBreakAt);
  }

  // ══ 第一遍：辉光（flash在这里最明显——shadowBlur半径剧烈扩张）══
  if(SHOW_GLOW && glowFactor > 0){
    let blurRadius = 22 + flashFactor * 58;
    drawingContext.shadowBlur  = blurRadius;
    drawingContext.shadowColor = glowColorStr;
    stroke(255);
    drawingContext.strokeStyle = strokeStyleValue;
    drawingContext.globalAlpha = (0.35 + glowFactor * 0.4);
    let glowW = LINE_W * (1.5 + flashFactor * 1.2);
    strokeWeight(glowW);

    // ★★★ 修复：辉光遍也必须跳过 jitter 超阈值的段 ★★★
    // 之前用 beginShape()...for all points...endShape() 画完整轮廓，
    // 完全不检查 jitter，把主线的断口全部填回去了——
    // 结果断口处"主线不在，但辉光还在"，视觉上只是变细/变暗，不是真正的断。
    for(let item of polys){
      let poly = item.poly;
      let jit  = poly.segJitter;
      for(let k = 0; k < poly.length - 1; k++){
        // ★ 改用 effectiveBreakAt：flash 高时阈值提高，断口重新连接
        if(jit && jit[k] > effectiveBreakAt) continue;
        line(poly[k].x, poly[k].y, poly[k+1].x, poly[k+1].y);
      }
    }

    drawingContext.shadowBlur = 0;
  }

  // ══ 第二遍：主线（flash在这里通过线宽变化体现）══
  drawingContext.globalAlpha = 1.0;
  stroke(255);
  drawingContext.strokeStyle = strokeStyleValue;
  for(let item of polys){
    // ★ 线宽系数 0.6 → 1.5：flash=1.0 时线宽从 1.0 升至 2.5px
    // 1.5m 观看距离下，2.5px 的白线比 1.6px 亮度感知提升约 60%
    let w = item.w * (1 + flashFactor * 1.5);
    drawPressureLine(item.poly, w, item.seed, effectiveBreakAt);
  }

  drawingContext.globalAlpha = 1.0;
  drawingContext.shadowBlur  = 0;

  // ══ ★ index_test.html：五官特征双层描边（最后绘制，压住所有层）══
  // 黑底(3px) + 白高亮(1.5~2.5px)，确保眼/眉/唇在任何切片灰阶下清晰可见。
  // 触摸时 fi 驱动白线增粗，增强因果感。
  if (SHOW_CRYSTAL_MESH) {
    drawFeatureLines(pathologyLevel, flashIntensity);
  }
}


// ══════════════════════════════════════════════════════════════════════
//  earPoly() —— 耳朵
//  沿用你旧版的方法：以脸的「上方向」为参考，在锚点上挂一个小形状。
//  尺寸只有 earScale 的 0.1~0.3，是贴着脸的，不是飘在外面的大弧。
// ══════════════════════════════════════════════════════════════════════

function earPoly(idx, isRight, chaos=0){
  // ★ 修复"耳朵掉了"：之前耳朵永远用 pt()（精准位置），
  // 但阶段2时脸部轮廓用 ptDrift() 在漂移——脸飘走了耳朵没跟着飘，
  // chaos很大时两者分离，看起来就像耳朵掉下来了。
  // 现在耳朵的锚点也用同一套漂移，chaos=0且driftBaseline=0时和之前完全一样。
  let useDrift = chaos > 0 || currentDriftBaseline > 0;
  let p    = useDrift ? ptDrift(idx, chaos) : pt(idx);
  let chin = useDrift ? ptDrift(152, chaos) : pt(152);
  let top  = useDrift ? ptDrift(10,  chaos) : pt(10);

  // 「往外」= 从画面中心指向锚点
  let ox = p.x - width/2, oy = p.y - height/2;
  let ol = max(1, dist(0,0,ox,oy));
  let ux = ox/ol, uy = oy/ol;

  // 「往上」= 从下巴指向额头（跟着头的倾斜转）
  let px2 = top.x - chin.x, py2 = top.y - chin.y;
  let fl = max(1, dist(0,0,px2,py2));
  let nx = px2/fl, ny = py2/fl;

  // ★ 耳朵尺寸 = 屏幕上的实际脸高 × 比例
  let faceH = dist(top.x, top.y, chin.x, chin.y);
  let S = faceH * 0.42;

  let pts = [];
  pts.push({x:p.x, y:p.y});
  if(isRight){
    pts.push({x:p.x+ux*S*0.10+nx*S*0.30, y:p.y+uy*S*0.10+ny*S*0.30});
    pts.push({x:p.x+ux*S*0.30+nx*S*0.05, y:p.y+uy*S*0.30+ny*S*0.05});
    pts.push({x:p.x+ux*S*0.15-nx*S*0.25, y:p.y+uy*S*0.15-ny*S*0.25});
  }else{
    pts.push({x:p.x+ux*S*0.15-nx*S*0.25, y:p.y+uy*S*0.15-ny*S*0.25});
    pts.push({x:p.x+ux*S*0.30+nx*S*0.05, y:p.y+uy*S*0.30+ny*S*0.05});
    pts.push({x:p.x+ux*S*0.10+nx*S*0.30, y:p.y+uy*S*0.10+ny*S*0.30});
  }
  pts.push({x:p.x, y:p.y});

  // 手动插值成平滑折线
  let out = [];
  for(let i=0;i<pts.length-1;i++){
    let a=pts[max(0,i-1)], b=pts[i], c=pts[i+1], d2=pts[min(pts.length-1,i+2)];
    for(let s=0;s<6;s++){
      let t=s/6;
      out.push({ x:curvePoint(a.x,b.x,c.x,d2.x,t), y:curvePoint(a.y,b.y,c.y,d2.y,t) });
    }
  }

  // ★★★ 08-04 修复：给耳朵挂 segJitter，让它和面部共用同一套断裂规则 ★★★
  //
  // 之前 earPoly 返回的 poly 没有 segJitter 属性，drawPressureLine 里
  //   if(jit && jit[i] > breakAt) continue;
  // 的 jit 是 undefined → 条件永远不成立 → 耳朵永远不断。
  // 面部在 chaos 升高时碎裂了，耳朵却完整地悬在那里。
  //
  // 修复：取耳朵锚点（idx）和头顶（10）、下巴（152）三个点的真实 jitter，
  // 加上 currentDriftBaseline 的贡献（residue 累积时即使锚点稳定也要断），
  // 填满整条折线。这样 breakAt 降低时，耳朵和脸同步碎裂。
  let earJ = 0;
  if (pointJitter) {
    let j1 = (idx < pointJitter.length) ? pointJitter[idx] : 0;
    let j2 = (152 < pointJitter.length) ? pointJitter[152] : 0;
    let j3 = (10  < pointJitter.length) ? pointJitter[10]  : 0;
    earJ = Math.max(j1, j2, j3);
  }
  // currentDriftBaseline 来自 fx.driftBaseline，随 residue 递增
  // 乘 0.3 是为了让耳朵跟着脸一起断，但不比脸先断
  earJ += currentDriftBaseline * 0.3;
  out.segJitter = new Array(out.length).fill(earJ);

  return out;
}


// ══════════════════════════════════════════════════════════════════════
//  ★ index_test.html 专用 ★
//
//  buildCrystalTris() —— 构建结晶三角拓扑
//
//  策略：使用 PATH_BASE / FACE_OVAL_IDX 里已验证的 landmark 序号，
//  用"扇形展开"生成三角面片，完全避免凭记忆写 MediaPipe 1404 个数字
//  （原 drawMeshLayer 注释已说明凭记忆容易写错）。
//
//  结构：
//    ① 外轮廓扇形（36 tri）：以鼻梁 landmark 1 为扇心向脸部轮廓展开
//    ② 双眉（各 3 tri）：沿眉毛路径扇形
//    ③ 双眼（各 4 tri）：沿眼眶路径扇形
//    ④ 鼻梁 strip（4 tri）：连续条形
//    ⑤ 鼻底（5 tri）：以鼻中隔点 2 为扇心
//    ⑥ 嘴轮廓扇形（18 tri）：以 landmark 0 为扇心
//    ⑦ 内唇线（6 tri）：以 landmark 78 为扇心
//  合计：约 83 个三角面，246 个索引。
// ══════════════════════════════════════════════════════════════════════

function buildCrystalTris() {
  const t = [];   // 平铺 [ia, ib, ic,  ia, ib, ic, ...] 格式

  // ── ① 外轮廓扇形（以 landmark 6 = 山根/两眼正中为扇心）──
  // ★ 修复：旧版以 landmark 1（鼻梁低点）为扇心，侧面时变成"鸟喙"放射感。
  //   landmark 6 = 眉间/山根，射线从眼睛高度向全脸辐射，
  //   侧面视角呈现 LiDAR 激光扫描仪结构，彻底消除滑稽感。
  const oval = FACE_OVAL_IDX.slice(0, -1);           // 36 points
  for (let i = 0; i < oval.length; i++) {
    t.push(6, oval[i], oval[(i + 1) % oval.length]); // 36 triangles, 扇心=6
  }

  // ── ② 右眉（PATH_BASE 里的顺序：70→63→105→66→107）──
  //    以 105（眉弓中段）为扇心
  const R_BROW = [70, 63, 105, 66, 107];
  t.push(105, 70, 63);    // outer half
  t.push(105, 66, 107);   // inner half

  // ── ③ 左眉（285→295→282→283→276）──
  //    以 295（眉弓中段）为扇心
  const L_BROW = [285, 295, 282, 283, 276];
  t.push(295, 285, 282);
  t.push(295, 282, 283);
  t.push(295, 283, 276);

  // ── ④ 右眼（33→160→158→133→153→144→33，闭合路径）──
  //    以 33（外眼角）为扇心
  t.push(33, 160, 158);
  t.push(33, 158, 133);
  t.push(33, 133, 153);
  t.push(33, 153, 144);

  // ── ⑤ 左眼（263→387→385→373→380→263，闭合路径）──
  //    以 263（外眼角）为扇心
  t.push(263, 387, 385);
  t.push(263, 385, 373);
  t.push(263, 373, 380);

  // ── ⑥ 鼻梁条形 strip（168→6→197→195→5→4）──
  //    相邻四边形拆成两个三角
  t.push(168, 6, 197);
  t.push(6, 197, 195);
  t.push(6, 195, 5);
  t.push(195, 5, 4);

  // ── ⑦ 鼻底与鼻翼（129→98→97→2→326→327→358）──
  //    以 2（鼻中隔基点）为扇心
  t.push(2, 129, 98);
  t.push(2, 98, 97);
  t.push(97, 2, 326);    // 跨过中心，闭合鼻底
  t.push(2, 326, 327);
  t.push(2, 327, 358);

  // ── ⑧ 嘴外轮廓扇形（PATH_BASE 里的路径，已验证）──
  //    以 0（上唇正中）为扇心，从 267 绕一圈到 37
  const MOUTH = [0,267,269,270,409,291,375,321,405,314,17,84,181,91,146,61,185,40,39,37];
  for (let i = 0; i < MOUTH.length - 2; i++) {
    t.push(MOUTH[0], MOUTH[i + 1], MOUTH[i + 2]);   // 18 triangles
  }

  // ── ⑨ 内唇线（78→81→13→311→308→402→14→178）──
  //    以 78（右嘴角内）为扇心
  t.push(78, 81, 13);
  t.push(78, 13, 311);
  t.push(78, 311, 308);
  t.push(78, 308, 402);
  t.push(78, 402, 14);
  t.push(78, 14, 178);

  console.log('[CRYSTAL] 三角面片数:', t.length / 3);
  return t;
}


// ══════════════════════════════════════════════════════════════════════
//  getKpZ() —— 读取指定 landmark 的原始 Z 深度
//
//  MediaPipe FaceMesh 的 z 值：相对于鼻尖的深度偏移，
//    z < 0 = 比鼻尖更靠近镜头（前景顶点）→ 亮
//    z > 0 = 比鼻尖更远离镜头（背景顶点）→ 暗
//  典型范围约 -0.05 ~ +0.05（normalized 坐标空间）。
//  未检测到脸时返回 0（中性值，不影响灰阶）。
// ══════════════════════════════════════════════════════════════════════

function getKpZ(idx) {
  if (!faces || faces.length === 0 || !faces[0].keypoints) return 0;
  const kp = faces[0].keypoints[idx];
  return kp ? (kp.z || 0) : 0;
}


// ══════════════════════════════════════════════════════════════════════
//  drawCrystalMesh() v3 —— 双轴解耦版
//
//  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  轴 1 · cycleProgress（0→1，累积，不回退）→ 面部几何完整度
//  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//    skipBase = 0.80 × (1 − cycleProgress)
//
//    cycleProgress=0.0 → skipBase=0.80 → 仅 20% 三角面可见（碎裂残缺）
//    cycleProgress=0.5 → skipBase=0.40 → 约 60% 三角面可见（拼合中）
//    cycleProgress=1.0 → skipBase=0.00 → 100% 完整结晶脸（Jeremie：amazing）
//
//    flashIntensity 可临时增加可见量（触摸瞬间爆破感更完整）
//    这一轴永远"向前"——面部结构只增不减。
//
//  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  轴 2 · energy（100→0，瞬时，停手即降）→ 诊断信号稳定性
//  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//    noiseAmt = (1 − energy/100) × 10 px
//
//    energy=100 → noiseAmt=0    → 切片边缘锐利，灰阶精准（健康信号）
//    energy=50  → noiseAmt=5px  → 轻微顶点微震，灰阶轻颤
//    energy=0   → noiseAmt=10px → 明显扫描噪波（信号衰败，但面结构保留）
//
//    不影响 skipBase → 已拼合的面部结构在 energy 衰退时不会消失。
//
//  其余保留：
//    · 放射原点 pt(6)（山根，消除鸟喙感）
//    · Z 深度加权（近亮远暗）
//    · 灰阶区间 [40,200] + fi² 白色爆破
//    · flashIntensity 径向顶点位移（从 pt(6) 向外）
// ══════════════════════════════════════════════════════════════════════

function drawCrystalMesh(chaos, fi, effectiveBreakAt) {
  if (!SHOW_CRYSTAL_MESH) return;
  if (!crystalTris || crystalTris.length === 0) return;
  if (smooth.length < 200) return;

  const numTris = crystalTris.length / 3;

  // ── 轴 1：cycleProgress → 完整度 skipBase ──
  // completionSkip: cycleProgress=0→0.80, cycleProgress=1→0.00（线性）
  const completionSkip = constrain(0.80 * (1.0 - cycleProgress), 0.0, 0.80);
  // fi 临时减少跳过量（触摸瞬间更多三角面闪现）
  const skipBase = Math.max(0, completionSkip - fi * 0.35);

  // ── 轴 2：energy → 噪波幅度 ──
  // energy=100→0px，energy=0→10px
  const noiseAmt = constrain((1.0 - energy / 100.0) * 10, 0, 10);

  // 放射原点：landmark 6（山根/两眼正中）
  const center = pt(6);

  push();
  strokeWeight(1.0);  // 铁律：1px 发丝描边
  stroke(255);

  for (let i = 0; i < numTris; i++) {
    const ia = crystalTris[i * 3];
    const ib = crystalTris[i * 3 + 1];
    const ic = crystalTris[i * 3 + 2];

    if (ia >= smooth.length || ib >= smooth.length || ic >= smooth.length) continue;

    // 确定性跳过（skipBase 由 cycleProgress 决定，不再由 chaos 驱动）
    const h = ((i * 2654435761) >>> 0) / 4294967295;
    if (h < skipBase) continue;

    // 顶点坐标（ptDrift 接收 energy→chaos，跟随信号漂移）
    const pA = smooth[ia] ? ptDrift(ia, chaos) : center;
    const pB = smooth[ib] ? ptDrift(ib, chaos) : center;
    const pC = smooth[ic] ? ptDrift(ic, chaos) : center;
    let ax = pA.x, ay = pA.y;
    let bx = pB.x, by = pB.y;
    let cx2 = pC.x, cy2 = pC.y;

    // ── 轴 2：能量噪波（顶点微震，信号衰败感）──
    // p5.noise() 而非 random()：平滑可重现，不产生视觉闪烁
    if (noiseAmt > 0.5) {
      const fc = frameCount * 0.04;
      ax  += (noise(ia  * 0.13,       fc) - 0.5) * noiseAmt * 2;
      ay  += (noise(ia  * 0.13 + 200, fc) - 0.5) * noiseAmt * 2;
      bx  += (noise(ib  * 0.13,       fc) - 0.5) * noiseAmt * 2;
      by  += (noise(ib  * 0.13 + 200, fc) - 0.5) * noiseAmt * 2;
      cx2 += (noise(ic  * 0.13,       fc) - 0.5) * noiseAmt * 2;
      cy2 += (noise(ic  * 0.13 + 200, fc) - 0.5) * noiseAmt * 2;
    }

    // ── Z 深度加权（近亮/远暗，转头时立体折转）──
    const zA  = getKpZ(ia), zB = getKpZ(ib), zC = getKpZ(ic);
    const avgZ = (zA + zB + zC) / 3;
    const depthFactor = constrain(map(avgZ, -0.05, 0.05, 1.15, 0.65), 0.65, 1.15);

    // ── 灰阶 [40,200] + 能量灰阶微闪 + fi² 触摸白色爆破 ──
    const baseGray   = 40 + ((i * 37) % 160);
    const depthGray  = constrain(Math.round(baseGray * depthFactor), 20, 210);
    // 能量低时灰阶轻微颤动（信号噪波效果）
    const greyNoise  = noiseAmt > 0.5
      ? (noise(i * 0.07 + 50, frameCount * 0.05) - 0.5) * noiseAmt * 4
      : 0;
    // fi=0→正常深度灰  fi=1→80% 向白（X光爆破感），fi² 让过渡更「爆」
    const finalGray  = Math.round(constrain(
      lerp(depthGray + greyNoise, 255, fi * fi * 0.80),
      20, 255
    ));

    // ── 触摸顶点爆破（径向，从 pt(6) 向外，20fps 自然坍缩）──
    if (fi > 0.001) {
      const mag = fi * CRYSTAL_MAX_DISP;

      const dAx = ax - center.x, dAy = ay - center.y;
      const lenA = Math.sqrt(dAx * dAx + dAy * dAy) || 1;
      ax  += (dAx / lenA) * mag;
      ay  += (dAy / lenA) * mag;

      const dBx = bx - center.x, dBy = by - center.y;
      const lenB = Math.sqrt(dBx * dBx + dBy * dBy) || 1;
      bx  += (dBx / lenB) * mag;
      by  += (dBy / lenB) * mag;

      const dCx = cx2 - center.x, dCy = cy2 - center.y;
      const lenC = Math.sqrt(dCx * dCx + dCy * dCy) || 1;
      cx2 += (dCx / lenC) * mag;
      cy2 += (dCy / lenC) * mag;
    }

    fill(finalGray);
    triangle(ax, ay, bx, by, cx2, cy2);
  }

  pop();
}


// ══════════════════════════════════════════════════════════════════════
//  drawFeatureLines() —— 五官特征双层描边（绘制在结晶切片之上）
//
//  问题：高对比度结晶背景会"吞噬"1px 发丝线条，眼睛/嘴唇轮廓消失。
//  解法：双层描边（Stroke Padding）——先黑底再白高亮，
//        任意背景灰阶下均清晰可见，无需改动其他渲染逻辑。
//
//  双层参数：
//    黑底   3.0px  stroke(0, 210)    ← 隔离背景，防止白线与灰色切片合并
//    白高亮 1.5px  stroke(255)       ← fi=1 时提升至 2.5px（触摸响应）
//
//  绘制时机：在 drawFace() 的最后执行（压住所有层）。
//  ★ 铁律：shadowBlur=0，noFill，无颜色渐变。
// ══════════════════════════════════════════════════════════════════════

function drawFeatureLines(chaos, fi) {
  if (smooth.length < 200) return;

  // ── 五官路径（全部来自已验证的 PATH_BASE 索引集）──
  const FEATURES = [
    [70, 63, 105, 66, 107],            // 右眉（外→内）
    [285, 295, 282, 283, 276],         // 左眉（外→内）
    [33, 160, 158, 133, 153, 144, 33], // 右眼（闭合）
    [263, 387, 385, 373, 380, 263],    // 左眼（闭合）
    // 嘴外轮廓（已验证，PATH_BASE 第 ⑧ 段）
    [0,267,269,270,409,291,375,321,405,314,17,84,181,91,146,61,185,40,39,37,0],
    [78, 81, 13, 311, 308, 402, 14, 178, 78]   // 内唇线（闭合）
  ];

  // 平滑折线（toSmoothPoly 含 Catmull-Rom 插值，与发丝层一致）
  const pols = FEATURES.map(path => toSmoothPoly(path, 5, chaos));

  // 高亮线宽随 fi 线性放大：1.5px(静止) → 2.5px(全闪)
  const hiW = constrain(1.5 + fi * 1.0, 1.5, 2.5);

  push();
  noFill();
  drawingContext.shadowBlur = 0;   // 铁律：五官线无光晕
  drawingContext.globalAlpha = 1.0;

  for (const poly of pols) {
    if (!poly || poly.length < 2) continue;

    // ── Pass 1：黑色底边（3px，提供背景对比度分离）──
    stroke(0, 210);
    strokeWeight(3.0);
    for (let k = 0; k < poly.length - 1; k++) {
      line(poly[k].x, poly[k].y, poly[k + 1].x, poly[k + 1].y);
    }

    // ── Pass 2：白色高亮线（压在黑底上方）──
    stroke(255);
    strokeWeight(hiW);
    for (let k = 0; k < poly.length - 1; k++) {
      line(poly[k].x, poly[k].y, poly[k + 1].x, poly[k + 1].y);
    }
  }

  pop();
}


// ══════════════════════════════════════════════════════════════════════
//  drawProgressBar() —— 大号临床进度条（index_test.html 专用）
//
//  绑定：cycleProgress（0→1，服务器广播，观众累计点击÷阈值）
//
//  设计原则：
//    · 极简 1px 白色边框，内部 4 级灰阶分格填充（铁律延伸）
//    · 纯黑背景格 + 白色边线，无任何颜色
//    · 大号百分比文字（~height×4%），1.5米外清晰可读
//    · 状态文字随进度切换（机构语言，让观众觉得自己在"帮助系统"）
//
//  位置：屏幕右侧，竖向居中，不遮挡面部
//
//  ★ 这是"糖衣"：观众看到条在涨（RECOVERING→NOMINAL），
//    表演者耳机里刀声越来越密——同一个 cycleProgress 驱动正反馈和惩罚。
// ══════════════════════════════════════════════════════════════════════

function drawProgressBar() {
  const pct = constrain(cycleProgress, 0, 1);

  // ── 几何参数 ──────────────────────────────────────────────────────
  const barW   = constrain(width * 0.046, 42, 58);  // ~4.6% 屏宽，42~58px
  const barH   = height * 0.70;                      // 70% 屏高
  const barX   = width - barW - 18;                  // 右侧，留 18px 边距
  const barY   = (height - barH) * 0.5;             // 竖向居中

  // 24 格（每格约 4.17%，每 6 格 = 25%）
  const N_SEGS     = 24;
  const segH       = barH / N_SEGS;
  const SEG_GAP    = 2;                              // 格间间隙（px）
  const filledSegs = Math.round(pct * N_SEGS);

  // 4 级临床灰阶（底部深→顶部浅，呼应"能量积累"的视觉逻辑）
  const SEG_GRAYS = [55, 100, 150, 200];

  push();
  drawingContext.shadowBlur = 0;
  textFont('monospace');

  // ── 分格填充（从底部向上，底=第0格，顶=第N-1格）──
  noStroke();
  for (let k = 0; k < filledSegs; k++) {
    fill(SEG_GRAYS[k % 4]);
    const sy = barY + (N_SEGS - 1 - k) * segH;
    rect(barX + 1, sy + SEG_GAP * 0.5, barW - 2, segH - SEG_GAP);
  }

  // ── 25% / 50% / 75% 刻度（小横线 + 数字）──
  [0.25, 0.50, 0.75].forEach(t => {
    const ty = barY + barH * (1.0 - t);
    stroke(100);
    strokeWeight(1.0);
    line(barX - 6, ty, barX, ty);        // 外刻度线
    stroke(50);
    line(barX, ty, barX + barW, ty);     // 内分割线（极淡）
    noStroke();
    fill(130);
    textSize(constrain(barW * 0.28, 8, 11));
    textAlign(RIGHT, CENTER);
    text(Math.round(t * 100), barX - 8, ty);
  });

  // ── 外框（1px 白色，最后画，压住填充）──
  noFill();
  stroke(255);
  strokeWeight(1.0);
  rect(barX, barY, barW, barH);

  // ── 临床标签（条上方）──
  noStroke();
  fill(255);
  const labelSz = constrain(barW * 0.28, 9, 12);
  textSize(labelSz);
  textAlign(CENTER, BOTTOM);
  text('SYS', barX + barW * 0.5, barY - 16);
  text('INTGR.', barX + barW * 0.5, barY - 4);

  // ── 大号百分比（条下方，1.5m 外可见）──
  const pctSz = constrain(height * 0.038, 28, 60);  // ~height×3.8%
  fill(255);
  textSize(pctSz);
  textAlign(CENTER, TOP);
  text(nf(Math.floor(pct * 100), 2) + '%', barX + barW * 0.5, barY + barH + 12);

  // ── 状态文字（进度百分比下方，机构语言"糖衣"）──
  const statusSz = constrain(barW * 0.28, 9, 11);
  fill(160);
  textSize(statusSz);
  textAlign(CENTER, TOP);
  const statusStr = pct < 0.25 ? 'DEGRADED'
                  : pct < 0.55 ? 'RECOVERING'
                  : pct < 0.88 ? 'NOMINAL'
                  : 'SUSTAINED';
  text(statusStr, barX + barW * 0.5, barY + barH + 12 + pctSz + 5);

  pop();
}
//  这版：只取一半发根、长度用噪声拉开 0.3~1.8 倍、加正弦卷曲。
// ══════════════════════════════════════════════════════════════════════

function hairPolys(){
  const ROOTS = [127,21,54,67,10,297,284,389,356];  // 只取9个，不是15个
  let cx = width/2, cy = height/2;
  let out = [];

  // 头发长度也用同样的方式：以屏幕实际脸高为基准，而不是 autoZoom
  let topP = pt(10), chinP = pt(152);
  let faceH = dist(topP.x, topP.y, chinP.x, chinP.y);

  for(let h=0; h<ROOTS.length; h++){
    let r = pt(ROOTS[h]);
    let dx = r.x-cx, dy = r.y-cy;
    let l = max(1, dist(0,0,dx,dy));
    dx/=l; dy/=l;

    // 长度差异极大：0.3~1.8 倍。均匀长度是"太阳图案"的元凶
    // HAIR_LEN/300 是「相对脸高的比例」，逗号句号键调的是这个比例
    let L = faceH * (HAIR_LEN/300) * (0.30 + noise(h*7.7)*1.5);

    let pts = [];
    for(let s=0; s<=7; s++){
      let t = s/7;
      // 卷曲：正弦 + 噪声，而不是单调漂移
      let curl = sin(t*PI*1.6 + h*2.1) * L * 0.30
               + (noise(h*4.4+t*3, frameCount*0.004)-0.5) * L * 0.35;
      pts.push({
        x: r.x + dx*L*t + (-dy)*curl,
        y: r.y + dy*L*t + ( dx)*curl - t*L*0.22
      });
    }

    let poly=[];
    for(let i=0;i<pts.length-1;i++){
      let a=pts[max(0,i-1)],b=pts[i],c=pts[i+1],d2=pts[min(pts.length-1,i+2)];
      for(let s=0;s<5;s++){
        let t=s/5;
        poly.push({x:curvePoint(a.x,b.x,c.x,d2.x,t), y:curvePoint(a.y,b.y,c.y,d2.y,t)});
      }
    }
    out.push(poly);
  }
  return out;
}


// ══════════════════════════════════════════════════════════════════════
//  HUD
// ══════════════════════════════════════════════════════════════════════

function drawHUD(stage){
  push();
  drawingContext.shadowBlur = 0;
  noStroke();
  let fps = frameRate().toFixed(0);
  let c = fps>=25 ? color(0,210,90) : fps>=15 ? color(255,175,0) : color(255,60,60);

  fill(0,0,0,175); rect(10,102,320,30,3);
  fill(c); textSize(13); textAlign(LEFT,TOP); text("FPS "+fps, 18, 110);
  fill(105); textSize(11);
  text("· "+(customColor ? "自定义色" : PALETTES[PALETTE].name), 72, 112);

  // ── ★ Energy / 阶段 / 系统状态——这一轮新加的核心状态显示 ──
  fill(0,0,0,190); rect(10, 138, 380, 34, 3);
  let stageLabel, stageColor;
  if(energy >= 50){ stageLabel = '阶段1 完美取悦';  stageColor = color(120,220,255); }
  else if(energy > 0){ stageLabel = '阶段2 机能衰竭'; stageColor = color(255,150,60); }
  else { stageLabel = '阶段3 死机';  stageColor = color(255,60,60); }

  fill(stageColor); textSize(13); textAlign(LEFT,TOP);
  text("ENERGY " + energy.toFixed(1) + "  " + stageLabel, 18, 146);
  fill(140); textSize(10);
  let chaosStr = stage ? "  chaos=" + stage.chaos.toFixed(2) : "";
  chaosStr += "  cycleProg=" + cycleProgress.toFixed(2);
  text("state=" + systemState + chaosStr + "  flash=" + flashIntensity.toFixed(2), 18, 163);

  fill(0,0,0,175); rect(10, height-90, width-20, 80, 3);
  fill(125); textSize(11); textAlign(LEFT,TOP);
  text("收缩 "+CONTRACT.toFixed(2)+"   抖动 "+WOBBLE.toFixed(1)+
       "   线宽(锁定) "+LOCKED_LINE_W.toFixed(1)+
       "   细节层级 "+DETAIL+
       "   头发 "+(SHOW_HAIR?"on":"off")+
       "   耳朵 "+(SHOW_EARS?"on":"off")+
       "   辉光 "+(SHOW_GLOW?"on":"off")+
       "   过渡线 "+(SHOW_TRAVEL?"on":"off"), 20, height-82);
  fill(115); textSize(11);
  let maskModeNames = ['柔边椭圆','跟随脸部轮廓(锁定)','矩形硬边画框'];
  text("遮罩 "+maskModeNames[MASK_MODE]+"（M调试）"+
       "   遮罩范围 "+maskSlider.value()+
       "   细节强化 "+detailSlider.value(), 20, height-64);
  fill(115); textSize(11);
  text("网格(锁定) 宽"+LOCKED_MESH_WIDTH+"/alpha"+LOCKED_MESH_ALPHA+
       "   网格密度 1/"+MESH_SKIP+
       "   辉光 "+glowSlider.value()+
       "   断裂阈值(测量) "+lastBreakAt.toFixed(2)+
       (meshEdges ? "   边数 "+meshEdges.length : ""), 20, height-46);
  fill(72); textSize(10);
  text("[T]★模拟触摸  [R]★恢复online  [←→]收缩  [↑↓]抖动  [D]细节  [H]发 [E]耳 [G]光 [Y]过渡线 [M]遮罩(调试)  [1/2/3]色  [S]存图",
       20, height-27);
  pop();
  noFill();
}


function keyPressed(){
  let k = key.toUpperCase();
  if(k==='H') SHOW_HAIR = !SHOW_HAIR;
  if(k==='E') SHOW_EARS = !SHOW_EARS;
  if(k==='G') SHOW_GLOW = !SHOW_GLOW;
  if(k==='Y') SHOW_TRAVEL = !SHOW_TRAVEL;   // 过渡线开关：从T挪到Y（T现在是模拟触摸）
  if(k==='D') DETAIL = (DETAIL+1)%3;
  if(k==='M'){ MASK_MODE = (MASK_MODE+1)%3; refreshMaskBtnStyles(); }  // 调试用，正式已锁定为1
  if(k==='1'){ PALETTE=0; customColor=null; }
  if(k==='2'){ PALETTE=1; customColor=null; }
  if(k==='3'){ PALETTE=2; customColor=null; }
  if(k==='S') saveCanvas('swarm_energy_'+floor(energy), 'png');

  // ★★★ 这一轮新加的两个测试键 ★★★
  if(k==='T') onTouch();          // 模拟一次触摸：flash + 消耗能量（之后是socket事件调用onTouch）
  if(k==='R') setSystemOnline();  // 模拟server发来的systemOnline：从OFFLINE恢复，energy重置100
  // ★ O 键 = 本地模拟崩溃（原来靠 energy<=0，现在改成手动）
  if(k==='O'){
    if(systemState === 'ONLINE'){
      captureFrozenFrame();
      systemState = 'FREEZING';
      freezeStartTime = millis();
    }
  }

  if(k===',') HAIR_LEN = max(20, HAIR_LEN-10);
  if(k==='.') HAIR_LEN = min(300, HAIR_LEN+10);

  if(keyCode===LEFT_ARROW)  CONTRACT = max(0,    CONTRACT-0.02);
  if(keyCode===RIGHT_ARROW) CONTRACT = min(0.40, CONTRACT+0.02);
  if(keyCode===UP_ARROW)    WOBBLE   = min(8, WOBBLE+0.3);
  if(keyCode===DOWN_ARROW)  WOBBLE   = max(0, WOBBLE-0.3);
  return false;
}
