<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">

  <!-- ============================================================
       视口：禁止一切缩放、保留刘海区域（viewport-fit=cover）
       ============================================================ -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, minimum-scale=1.0,
                 user-scalable=no, viewport-fit=cover">

  <!-- 加入主屏后以全屏 App 模式运行（iOS / Android） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">

  <title>SWARM</title>

  <style>

    /* ============================================================
       基础：纯黑、禁止滚动、禁止一切系统默认手势
       ============================================================ */
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      position: fixed;                /* 消灭 iOS 橡皮筋回弹 */
      overscroll-behavior: none;      /* 消灭安卓下拉刷新 */
      touch-action: none;             /* 关闭浏览器内置手势（关键！） */
      -webkit-user-select: none;
      user-select: none;              /* 禁止长按选文字 */
      -webkit-touch-callout: none;    /* 禁止长按弹出菜单（iOS） */
      -webkit-tap-highlight-color: transparent; /* 去掉点击灰块 */
    }

    /* 触摸舞台：铺满全屏 */
    #stage {
      position: fixed;
      inset: 0;
      background: #000;
      overflow: hidden;
    }

    /* ============================================================
       暖色余烬光点
       普通触摸：直径 180px，300ms 消散
       大奖励  ：直径 360px，500ms 消散（服务器触发，不由客户端随机）
       ============================================================ */
    .ember {
      position: absolute;
      width: 180px;
      height: 180px;
      margin: -90px 0 0 -90px;       /* 让圆心对准手指位置 */
      border-radius: 50%;
      pointer-events: none;           /* 不拦截触摸事件 */
      background: radial-gradient(
        circle,
        rgba(255, 210, 130, 0.95)  0%,   /* 核心：暖白 */
        rgba(255, 130,  30, 0.55) 32%,   /* 中层：琥珀橙 */
        rgba(200,  50,   0, 0.18) 60%,   /* 外层：暗红余烬 */
        rgba(  0,   0,   0, 0.00) 72%    /* 边缘：完全透明 */
      );
      animation: emberOut 300ms ease-out forwards;
    }

    /* 大奖励变体：更大、更亮、更慢 */
    .ember-big {
      width: 360px;
      height: 360px;
      margin: -180px 0 0 -180px;
      background: radial-gradient(
        circle,
        rgba(255, 230, 160, 1.00)  0%,
        rgba(255, 160,  50, 0.65) 28%,
        rgba(220,  70,   0, 0.22) 58%,
        rgba(  0,   0,   0, 0.00) 70%
      );
      animation: emberOut 500ms ease-out forwards;
    }

    /* 光点动画：从无到有、绽放、消散 */
    @keyframes emberOut {
      0%   { transform: scale(0.05); opacity: 1;   }
      30%  { transform: scale(1);    opacity: 0.88; }
      100% { transform: scale(1.12); opacity: 0;   }
    }

    /* ============================================================
       调试状态指示（展览当天删掉这一块即可）
       位于右下角，极小的灰字，几乎不可见
       ============================================================ */
    #dbg {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
      right: 12px;
      font-family: monospace;
      font-size: 9px;
      letter-spacing: 0.04em;
      color: #2a2a2a;                 /* 近黑：调试时凑近看能看到 */
      pointer-events: none;
      z-index: 99;
    }

  </style>
</head>

<body>
  <!-- 触摸舞台：这就是整个页面 -->
  <div id="stage"></div>

  <!-- 调试指示：展览前删掉 <div id="dbg"> 这一行即可 -->
  <div id="dbg">○</div>


  <!-- ============================================================
       Socket.io 客户端：从 CDN 加载
       版本锁定 4.7.5，与服务器 socket.io 大版本号一致
       ============================================================ -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <script>

    // ==============================================================
    // 【配置区】只需改这里，其他地方不用动
    // ==============================================================

    // 服务器地址：你的 Render 网址
    // 如果将来把这个文件放回服务器的 public/ 文件夹，
    // 可以改成 window.location.origin（自动适配）
    const SERVER = 'https://cyber-swarm-backend.onrender.com';

    // 普通触摸震动时长（毫秒）
    const VIB_NORMAL = 35;

    // ==============================================================
    // 初始化
    // ==============================================================

    const stage = document.getElementById('stage');
    const dbg   = document.getElementById('dbg');

    // 系统是否处于 OFFLINE 状态（垮掉期间触摸无反馈）
    let isOffline = false;

    // ==============================================================
    // 连接服务器
    // transports 顺序：先尝试 WebSocket，失败再降级 polling
    // ==============================================================
    const socket = io(SERVER, {
      transports: ['websocket', 'polling'],
    });

    // 连上：调试点显示「●」
    socket.on('connect', () => {
      dbg.textContent = '●';
    });

    // 断线：显示「○」（socket.io 会自动不断重连，无需手动处理）
    socket.on('disconnect', () => {
      dbg.textContent = '○';
    });


    // ==============================================================
    // 触摸处理
    // 手指按下 → 归一化坐标 → emit('touch') → 生成光点 → 震动
    // ==============================================================
    function onTouchStart(e) {
      e.preventDefault(); // 阻止浏览器的所有默认行为

      // 系统 OFFLINE 期间：静默，不发送，不反馈
      if (isOffline) return;

      // 支持多指同时触摸（changedTouches = 这次新按下的所有手指）
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];

        // 归一化坐标：像素位置 ÷ 屏幕宽高，得到 0~1 的小数
        const x = clamp(t.clientX / window.innerWidth,  0, 1);
        const y = clamp(t.clientY / window.innerHeight, 0, 1);

        // ★ 发送给服务器（接口字段：touch / {x, y}，不得改动）
        socket.emit('touch', { x, y });

        // 在手指位置生成暖色余烬光点
        spawnEmber(t.clientX, t.clientY, false);

        // 普通触摸震动
        vibrate(VIB_NORMAL);
      }
    }

    // 绑定触摸事件（passive: false 是必须的，否则 preventDefault 失效）
    stage.addEventListener('touchstart', onTouchStart,              { passive: false });
    stage.addEventListener('touchmove',  e => e.preventDefault(),  { passive: false });
    stage.addEventListener('touchend',   e => e.preventDefault(),  { passive: false });

    // iOS 双指手势（缩放）的额外拦截
    document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });

    // 右键 / 长按菜单
    document.addEventListener('contextmenu', e => e.preventDefault());

    // 300ms 内的第二次 touchend = 双击 → 拦截（防止浏览器放大）
    let lastTap = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTap < 300) e.preventDefault();
      lastTap = now;
    }, { passive: false });


    // ==============================================================
    // 监听服务器广播：triggerSugar（糖 = 给观众的奖励）
    //
    // 接口字段：{ big, x, y }
    //   big = true  → 变率强化大奖励（约 1/8 概率，由服务器决定）
    //   big = false → 普通奖励
    //
    // 客户端【不再】自行随机，big 值完全由服务器决定。
    // ==============================================================
    socket.on('triggerSugar', payload => {
      if (isOffline) return;

      const big = payload && payload.tier === 'large';

      if (big) {
        // 大奖励：在屏幕中心爆发一个更大的光晕 + 强节奏震动
        spawnEmber(window.innerWidth / 2, window.innerHeight / 2, true);
        vibrate([0, 55, 35, 80]); // 有节奏的双震动，像「中奖」
      }
      // 普通 sugar：触摸本身的光点已经是反馈，不需要额外叠加
    });


    // ==============================================================
    // 监听服务器广播：state（完整状态快照，约每秒 10 次）
    // 我们只关心 status 字段：ONLINE / OFFLINE
    // ==============================================================
    socket.on('state', s => {
      if (!s) return;
      setOffline(s.status === 'OFFLINE');
    });

    // systemOffline / systemOnline 单独事件，做双保险
    socket.on('systemOffline', () => setOffline(true));
    socket.on('systemOnline',  () => setOffline(false));


    // ==============================================================
    // 工具函数
    // ==============================================================

    // 生成余烬光点
    // px/py：屏幕像素坐标（圆心）
    // big  ：是否使用大奖励样式
    function spawnEmber(px, py, big) {
      const el = document.createElement('div');
      el.classList.add('ember');
      if (big) el.classList.add('ember-big');
      el.style.left = px + 'px';
      el.style.top  = py + 'px';
      stage.appendChild(el);
      // 动画结束后自动移除，避免 DOM 越堆越多
      el.addEventListener('animationend', () => el.remove(), { once: true });
    }

    // 切换系统离线状态
    // 正式版：屏幕保持纯黑，没有任何文字提示
    function setOffline(off) {
      if (off === isOffline) return;
      isOffline = off;
      // （如需调试可在此处加 console.log）
    }

    // 震动封装（不支持的设备静默跳过，不报错）
    function vibrate(pattern) {
      if (navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch (e) {}
      }
    }

    // 将数值限制在 [min, max] 范围内
    function clamp(v, min, max) {
      return Math.min(max, Math.max(min, v));
    }

  </script>
</body>
</html>
