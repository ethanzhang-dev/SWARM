<!DOCTYPE html>
<!--
╔══════════════════════════════════════════════════════════════════╗
║  SWARM · phone.html  正式版                                      ║
╠══════════════════════════════════════════════════════════════════╣
║  【测试方法】                                                     ║
║                                                                  ║
║  A) 本地测试（默认）                                              ║
║     1. 电脑跑 node server.js                                      ║
║     2. 手机与电脑连同一 WiFi                                      ║
║     3. 手机 Chrome 打开 http://10.9.3.189:3000/phone.html        ║
║                                                                  ║
║  B) 线上测试                                                      ║
║     把顶部 SERVER 换成注释里的 Render 地址，重新上传              ║
║                                                                  ║
║  C) 验证链路                                                      ║
║     电脑开 monitor.html，手机戳屏，调试台触摸数在涨 = 链路通     ║
║     右下角 ● 已连服务器 / ○ 断线                                 ║
║                                                                  ║
║  D) 展览前唯一需要做的事                                          ║
║     删掉 <div id="dbg"> 那一行，切换为线上 SERVER 地址            ║
╚══════════════════════════════════════════════════════════════════╝
-->
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, minimum-scale=1.0,
                 user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable"          content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable"                content="yes">
  <meta name="theme-color"                           content="#000000">
  <title>SWARM</title>

  <style>
    /* ── 全局重置 ─────────────────────────────────────────── */
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      position: fixed;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── 背景呼吸辉光层（JS 每帧更新 style.background） ───── */
    #glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%,
        rgba(200, 140, 60, 0.02) 0%, transparent 70%);
    }

    /* ── 特效容器（压入圈 + 涟漪动态插入此处） ────────────── */
    #fx {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* ── 压入暗圈：触摸瞬间触点变暗，持续 50ms ────────────── */
    .press-in {
      position: absolute;
      width:  90px;
      height: 90px;
      margin: -45px 0 0 -45px;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle,
        rgba(0,0,0,0.40)  0%,
        rgba(0,0,0,0.12) 55%,
        transparent       80%);
      animation: pressAnim 50ms ease-out forwards;
    }
    @keyframes pressAnim {
      0%   { transform: scale(0.4); opacity: 1; }
      100% { transform: scale(1.0); opacity: 0; }
    }

    /* ── 琥珀涟漪：覆盖屏幕约 25% 面积（直径 324px）─────────
       Phase1 (0→26% = 120ms)：扩展至满，保持不透明度
       Phase2 (26→100% = 350ms)：淡出至 0
       总时长 470ms
       ──────────────────────────────────────────────────────── */
    .ripple {
      position: absolute;
      width:  324px;
      height: 324px;
      margin: -162px 0 0 -162px;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle,
        rgba(255,140,  0, 0.55)  0%,
        rgba(255, 90,  0, 0.28) 45%,
        transparent              70%);
      animation: rippleAnim 470ms ease-out forwards;
    }
    /* 大奖励涟漪（triggerSugar tier=big）*/
    .ripple-big {
      width:  648px;
      height: 648px;
      margin: -324px 0 0 -324px;
      background: radial-gradient(circle,
        rgba(255,180, 60, 0.65)  0%,
        rgba(255,110,  0, 0.38) 40%,
        transparent               68%);
      animation: rippleAnim 600ms ease-out forwards;
    }
    @keyframes rippleAnim {
      0%   { transform: scale(0.04); opacity: 0.55; }
      26%  { transform: scale(1.00); opacity: 0.52; }
      100% { transform: scale(1.06); opacity: 0.00; }
    }

    /* ── 调试指示（展览前删掉 <div id="dbg"> 整行） ─────────*/
    #dbg {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
      right: 12px;
      font-family: monospace;
      font-size: 9px;
      color: #282828;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>

<body>
  <div id="glow"></div>
  <div id="fx"></div>

  <!-- 调试指示：展览前删掉这一行 ↓ -->
  <div id="dbg">○</div>

  <!-- Socket.io CDN，版本锁 4.7.5 -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <script>

    /* ════════════════════════════════════════════════════════
       【配置区】切换本地 / 线上只改这两行
       ════════════════════════════════════════════════════════ */
    // 自动选择连接地址
    // 本地排练（局域网 IP / localhost）→ 连本地服务器
    // 线上展览（Render 域名）          → 连 Render
    const LOCAL_IP = 'http://10.9.3.189:3000';
    const IS_LOCAL = window.location.hostname === 'localhost' ||
                     window.location.hostname === '127.0.0.1' ||
                     window.location.hostname.startsWith('10.')  ||
                     window.location.hostname.startsWith('192.168.');
    const SERVER = IS_LOCAL
      ? (window.location.origin.includes('3000') ? window.location.origin : LOCAL_IP)
      : 'https://cyber-swarm-backend.onrender.com';

    // 是否启用 45 秒无人招揽模式
    const ENABLE_IDLE_ATTRACT = true;

    /* ════════════════════════════════════════════════════════
       DOM
       ════════════════════════════════════════════════════════ */
    const glowEl = document.getElementById('glow');
    const fxEl   = document.getElementById('fx');
    const dbg    = document.getElementById('dbg');

    /* ════════════════════════════════════════════════════════
       状态
       ════════════════════════════════════════════════════════ */
    let isOffline     = false;
    let energy        = 50;   // 来自 state.energy (0-100)
    let feedbackDelay = 80;   // 来自 state.fx.feedbackDelay (ms)

    // 呼吸振荡器（累积相位，切换频率时曲线不跳变）
    let breathPhase      = 0;
    let breathFreq       = 0.16; // 当前频率 Hz（平滑过渡中间值）
    let breathFreqTarget = 0.16; // 目标频率 Hz（连击数决定）
    let breathAmplitude  = 1.0;  // 振幅倍率（idle 最高 2.7）

    // 连击
    let combo       = 0;
    let lastTapTime = 0;
    const COMBO_WIN = 400; // ms

    // Idle 招揽
    let lastTouchTime = performance.now();

    // RAF
    let lastRafTime = null;

    /* ════════════════════════════════════════════════════════
       Socket.io 连接
       ════════════════════════════════════════════════════════ */
    const socket = io(SERVER, { transports: ['websocket', 'polling'] });

    socket.on('connect',    () => { dbg.textContent = '●'; });
    socket.on('disconnect', () => { dbg.textContent = '○'; });

    /* ── state（每次触摸 + 每 500ms 推送）──────────────────
       ★ isOnline === false → 系统离线（API 规范）
       ★ energy            → 辉光基础亮度
       ★ fx.feedbackDelay  → 本地反馈延迟时长
       ──────────────────────────────────────────────────────*/
    socket.on('state', s => {
      if (!s) return;
      setOffline(s.isOnline === false);
      if (s.energy !== undefined)              energy        = s.energy;
      if (s.fx && s.fx.feedbackDelay != null)  feedbackDelay = s.fx.feedbackDelay;
    });

    /* ── triggerSugar──────────────────────────────────────
       ★ tier: 'small'|'medium'|'big'（API 规范）
       ★ 大奖励判断：payload.tier === 'big'（非旧版 payload.big）
       ──────────────────────────────────────────────────────*/
    socket.on('triggerSugar', payload => {
      if (isOffline) return;
      const tier = payload && payload.tier;
      if (tier === 'big') {
        const delay = feedbackDelay;
        setTimeout(() => {
          spawnRipple(window.innerWidth / 2, window.innerHeight / 2, true);
          vibrate([0, 60, 40, 90]);
        }, delay);
      } else if (tier === 'medium') {
        const delay = feedbackDelay;
        setTimeout(() => vibrate(50), delay);
      }
      // small：触摸自身的涟漪已是完整反馈
    });

    /* ── 以下事件 phone.html 不需要处理，不注册监听器 ──────
       triggerKnife   → 仅供 display.html 声音模块使用
       knifeToSpeakers→ 仅供 display.html 声音模块使用
       systemOffline  → 通过 state.isOnline 判断，此事件忽略
       systemOnline   → 通过 state.isOnline 判断，此事件忽略
       sessionReset   → 仅供 cue.html 使用
       lightCue       → 仅供 cue.html 使用
       ──────────────────────────────────────────────────────*/

    /* ════════════════════════════════════════════════════════
       触摸处理
       ════════════════════════════════════════════════════════ */
    function onTouchStart(e) {
      e.preventDefault();
      if (isOffline) return;

      const now = performance.now();

      // 连击计数
      combo = (now - lastTapTime < COMBO_WIN) ? Math.min(combo + 1, 10) : 1;
      lastTapTime   = now;
      lastTouchTime = now; // 重置 idle 计时

      // 目标呼吸频率（0.16 + 连击数 × 0.055）
      breathFreqTarget = 0.16 + combo * 0.055;

      for (let i = 0; i < e.changedTouches.length; i++) {
        const t  = e.changedTouches[i];
        const px = t.clientX;
        const py = t.clientY;

        /* ★★★ socket.emit 必须在 setTimeout 外部立即发送 ★★★
           服务器收到 touch 不应被 feedbackDelay 延迟
           只有本地视觉 + 震动才进 setTimeout               */
        socket.emit('touch');

        ;(function(x, y, delay) {
          setTimeout(() => {
            spawnPressIn(x, y);
            spawnRipple(x, y, false);
            vibrate(35);
          }, delay);
        })(px, py, feedbackDelay);
      }
    }

    document.addEventListener('touchstart', onTouchStart,             { passive: false });
    document.addEventListener('touchmove',  e => e.preventDefault(), { passive: false });
    document.addEventListener('touchend',   e => e.preventDefault(), { passive: false });
    document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
    document.addEventListener('contextmenu',  e => e.preventDefault());

    // 防双击放大
    let _lt = 0;
    document.addEventListener('touchend', e => {
      const n = Date.now();
      if (n - _lt < 300) e.preventDefault();
      _lt = n;
    }, { passive: false });

    /* ════════════════════════════════════════════════════════
       呼吸循环 (RAF)
       ════════════════════════════════════════════════════════ */
    function breathLoop(now) {
      requestAnimationFrame(breathLoop);

      if (lastRafTime === null) lastRafTime = now;
      const dt = Math.min((now - lastRafTime) / 1000, 0.1);
      lastRafTime = now;

      // 平滑频率（不跳变）
      breathFreq = lerp(breathFreq, breathFreqTarget, 0.03);

      // 连击超时 → 目标回落
      if (combo > 0 && (now - lastTapTime) > COMBO_WIN) {
        combo = 0;
        breathFreqTarget = 0.16;
      }

      // 累积相位（核心：频率切换时曲线连续）
      breathPhase += breathFreq * dt * Math.PI * 2;
      const breathNorm = (Math.sin(breathPhase) + 1) / 2; // 0~1

      // Idle 招揽：振幅
      const idleMs = now - lastTouchTime;
      if (ENABLE_IDLE_ATTRACT && !isOffline && idleMs > 45000) {
        breathAmplitude = lerp(breathAmplitude, 2.7,  0.0008);
      } else {
        breathAmplitude = lerp(breathAmplitude, 1.0,  0.06);
      }

      // 亮度计算：基础 0.020 + energy 补偿 + 正弦波动 0.016
      const energyBoost  = (energy / 100) * 0.006;
      const opacity      = 0.020 + energyBoost + breathNorm * 0.016 * breathAmplitude;
      const finalOpacity = isOffline ? opacity * 0.4 : opacity;

      glowEl.style.background =
        `radial-gradient(circle at 50% 50%,` +
        ` rgba(210,145,65,${finalOpacity.toFixed(4)}) 0%,` +
        ` rgba(150,90,25,${(finalOpacity * 0.32).toFixed(4)}) 46%,` +
        ` transparent 72%)`;
    }
    requestAnimationFrame(breathLoop);

    /* ════════════════════════════════════════════════════════
       工具函数
       ════════════════════════════════════════════════════════ */
    function spawnPressIn(px, py) {
      const el = document.createElement('div');
      el.className  = 'press-in';
      el.style.left = px + 'px';
      el.style.top  = py + 'px';
      fxEl.appendChild(el);
      el.addEventListener('animationend', () => el.remove(), { once: true });
    }

    function spawnRipple(px, py, big) {
      const el = document.createElement('div');
      el.className  = big ? 'ripple ripple-big' : 'ripple';
      el.style.left = px + 'px';
      el.style.top  = py + 'px';
      fxEl.appendChild(el);
      el.addEventListener('animationend', () => el.remove(), { once: true });
    }

    function setOffline(off) {
      if (off === isOffline) return;
      isOffline = off;
      if (off) { combo = 0; breathFreqTarget = 0.16; }
    }

    function lerp(a, b, t) { return a + (b - a) * t; }

    function vibrate(pattern) {
      if (navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch (_) {}
      }
    }

  </script>
</body>
</html>
